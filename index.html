<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PM-SC Academia Imersiva</title>

<style>
:root {
  --bg:#081710;
  --panel:#122b20;
  --accent:#72ecaa;
  --fg:#effcf3;
  --soft:#b5d4c1;
  --line:#416950;
}
* {box-sizing:border-box}
body {
  margin:0;
  font:16px system-ui,Arial;
  background:var(--bg);
  color:var(--fg);
}
header {
  padding:16px;
  background:#10291d;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.layout {
  display:grid;
  grid-template-columns:235px minmax(0,1fr);
  gap:12px;
  padding:12px;
}
aside,.box {
  background:var(--panel);
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;
}
nav {display:grid;gap:7px}
button,select,input {
  background:#244232;
  color:var(--fg);
  border:1px solid #5a896c;
  padding:10px;
  border-radius:8px;
  font:inherit;
  max-width:100%;
}
button {cursor:pointer}
button:hover,button:focus-visible {
  outline:2px solid var(--accent);
}
button.active {
  border-color:var(--accent);
  background:#276142;
}
label {display:block;margin:12px 0 5px}
select,input {width:100%}
.row {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0;
}
.row button {flex:1 1 auto}
#scene {
  width:100%;
  height:340px;
  background:#172b24;
  border-radius:10px;
  overflow:hidden;
}
#scene canvas {display:block}
#content {
  margin-top:12px;
  line-height:1.55;
  min-height:240px;
}
h1 {font-size:1.3rem;margin:0}
h2 {margin-top:0}
p {overflow-wrap:anywhere}
.muted {color:var(--soft)}
.question {
  font-size:1.1rem;
  white-space:pre-wrap;
}
.option {
  display:block;
  width:100%;
  text-align:left;
  margin:8px 0;
  white-space:pre-wrap;
}
.correct {
  border:2px solid #70ffaa;
  background:#215b3b;
}
.wrong {
  border:2px solid #ff8b8b;
  background:#572c2c;
}
.stat {
  display:inline-block;
  background:#244232;
  padding:12px;
  border-radius:9px;
  margin:5px;
}
hr {
  border:0;
  border-top:1px solid var(--line);
}
body.light {
  --bg:#eaf4eb;
  --panel:#fff;
  --fg:#17251b;
  --soft:#486c55;
  --line:#abc7b1;
  --accent:#12794e;
}
body.light button,
body.light select,
body.light input {
  background:#e1efe3;
  color:#17251b;
}
@media(max-width:800px) {
  .layout {grid-template-columns:1fr}
  nav {grid-template-columns:repeat(3,1fr)}
  nav button {font-size:.85rem;padding:7px}
  #scene {height:270px}
}
</style>
</head>

<body>

<header>
  <h1>🇧🇷 PM-SC • Academia Imersiva de Estudos</h1>
  <span id="status" role="status">Iniciando...</span>
</header>

<div class="layout">
  <aside>
    <nav id="nav"></nav>

    <label for="env">Ambiente 3D</label>
    <select id="env"></select>

    <label for="subject">Disciplina</label>
    <select id="subject">
      <option value="">Todas</option>
    </select>

    <label for="search">Buscar questão</label>
    <input id="search" placeholder="Digite uma palavra">

    <div class="row">
      <button id="reload">Atualizar JSON</button>
      <button id="enterVR">Entrar em VR</button>
    </div>

    <small class="muted">
      Na RV: aponte e aperte o gatilho, ou use a pinça
      das mãos (se disponível). Para se deslocar,
      aponte ao chão e aperte o gatilho.
    </small>
  </aside>

  <main>
    <section class="box">
      <div id="scene"></div>
    </section>
    <section class="box" id="content"></section>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import {XRControllerModelFactory} from 'three/addons/webxr/XRControllerModelFactory.js';
import {XRHandModelFactory} from 'three/addons/webxr/XRHandModelFactory.js';

const REPO='johndosanjos162/PMSC';
const STORE='pmsc-imersiva-v5';

const $=id=>document.getElementById(id);
const now=()=>Date.now();

const pages=[
  ['inicio','Início'],
  ['aulas','Aulas'],
  ['questoes','Questões'],
  ['simulado','Simulado'],
  ['flashcards','Flashcards'],
  ['revisoes','Revisões'],
  ['estatisticas','Estatísticas'],
  ['banco','Banco JSON'],
  ['config','Configurações']
];

const envs=[
  'Pátio de formatura',
  'Sala de instrução',
  'Entrada do quartel',
  'Campo de treinamento',
  'Alojamento',
  'Biblioteca',
  'Auditório',
  'Sala de estudos',
  'Praça central',
  'Centro de operações'
];

const initial={
  history:[],
  favorites:[],
  reviews:{},
  exams:[],
  answer:null,
  exam:null,
  theme:'dark',
  env:0
};

let state={...initial};
let questions=[];
let page='inicio';
let qIndex=0;
let activePool=[];
let flipped=false;
let db=null;
let loadDetails='Ainda não carregado';

try {
  state={
    ...initial,
    ...JSON.parse(localStorage.getItem(STORE)||'{}')
  };
} catch {}

if(!Array.isArray(state.history))state.history=[];
if(!Array.isArray(state.favorites))state.favorites=[];
if(!state.reviews||typeof state.reviews!=='object')state.reviews={};
if(!Array.isArray(state.exams))state.exams=[];

function save() {
  try {
    localStorage.setItem(STORE,JSON.stringify(state));
  } catch(e) {
    setStatus('Não foi possível salvar: '+e.message);
  }
  idbSet('progress',state).catch(()=>{});
}

function setStatus(t) {
  $('status').textContent=t;
}

function el(tag,txt,parent) {
  const e=document.createElement(tag);
  if(txt!==null&&txt!==undefined)e.textContent=String(txt);
  if(parent)parent.append(e);
  return e;
}

function btn(txt,fn,parent) {
  const b=el('button',txt,parent);
  b.addEventListener('click',fn);
  return b;
}

function byId(id) {
  return questions.find(q=>q.id===id);
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function dbOpen() {
  return new Promise(resolve=>{
    if(!('indexedDB' in window)){
      resolve(null);
      return;
    }
    try {
      const r=indexedDB.open('PMSCAcademia',1);
      r.onupgradeneeded=()=>{
        r.result.createObjectStore('data');
      };
      r.onsuccess=()=>resolve(r.result);
      r.onerror=()=>resolve(null);
    } catch {
      resolve(null);
    }
  });
}

async function idbGet(key) {
  if(!db)return null;
  return new Promise(resolve=>{
    try {
      const r=db.transaction('data')
        .objectStore('data').get(key);
      r.onsuccess=()=>resolve(r.result??null);
      r.onerror=()=>resolve(null);
    } catch {
      resolve(null);
    }
  });
}

async function idbSet(key,value) {
  if(!db)return;
  return new Promise(resolve=>{
    try {
      const r=db.transaction('data','readwrite')
        .objectStore('data').put(value,key);
      r.onsuccess=()=>resolve();
      r.onerror=()=>resolve();
    } catch {
      resolve();
    }
  });
}

/* NORMALIZAR QUESTÕES */

function normalize(raw,disc) {
  if(!raw||typeof raw!=='object')return null;

  const text=raw.pergunta??raw.enunciado??raw.question;
  let opts=raw.alternativas??raw.opcoes??raw.options;

  if(opts&&!Array.isArray(opts)&&typeof opts==='object') {
    opts=Object.values(opts);
  }

  if(!Array.isArray(opts)||typeof text!=='string'||
     !text.trim()||opts.length<2)return null;

  opts=opts.map(x=>typeof x==='string'
    ?x:String(x?.texto??x?.text??''));

  let key=raw.correta??raw.gabarito??raw.correct??raw.resposta;

  if(typeof key==='string') {
    const s=key.trim().toUpperCase();
    key=/^[A-Z]$/.test(s)
      ?s.charCodeAt(0)-65
      :Number(s);
  }

  if(!Number.isInteger(key)||key<0||
     key>=opts.length||opts.some(x=>!x.trim()))return null;

  const materia=String(raw.disciplina||disc||'Geral');

  return {
    id:String(raw.id||raw.codigo||materia+':'+text.trim()),
    disciplina:materia,
    assunto:String(raw.assunto||raw.topico||'Geral'),
    dificuldade:String(raw.dificuldade||'Não informada'),
    pergunta:text,
    alternativas:opts,
    correta:key,
    explicacao:String(raw.explicacao||raw.comentario||''),
    referencia:String(raw.referencia||'')
  };
}

function extract(data,disc='Geral',out=[]) {
  if(Array.isArray(data)) {
    for(const row of data)extract(row,disc,out);
    return out;
  }
  if(!data||typeof data!=='object')return out;

  if('pergunta' in data||'enunciado' in data||'question' in data) {
    const q=normalize(data,disc);
    if(q)out.push(q);
    return out;
  }

  for(const [name,val] of Object.entries(data)) {
    if(!val||typeof val!=='object')continue;
    const generic=[
      'questoes','questions','dados','data','disciplinas','items'
    ];
    extract(
      val,
      generic.includes(name.toLowerCase())?disc:name,
      out
    );
  }
  return out;
}

/* CARREGAR JSON DO GITHUB */

async function loadBank() {
  setStatus('Lendo arquivos JSON da raiz...');

  let urls=new Set(['./json.json']);
  let checked=0;
  let rejected=0;
  let errors=[];

  try {
    const r=await fetch(
      `https://api.github.com/repos/${REPO}/contents/`,
      {cache:'no-store'}
    );
    if(r.ok) {
      const contents=await r.json();
      if(Array.isArray(contents)) {
        for(const f of contents) {
          if(f.type==='file'&&
             /\.json$/i.test(f.name)&&f.download_url) {
            urls.add(f.download_url);
          }
        }
      }
    } else {
      errors.push('API GitHub: '+r.status);
    }
  } catch(e) {
    errors.push('API: '+e.message);
  }

  const map=new Map();

  for(const url of urls) {
    try {
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw Error(String(r.status));

      const raw=await r.text();
      if(raw.length>15000000)throw Error('arquivo muito grande');

      const json=JSON.parse(raw);
      const list=extract(json);

      for(const q of list) {
        if(!map.has(q.id))map.set(q.id,q);
      }
      checked++;
    } catch(e) {
      rejected++;
      errors.push(url.split('/').pop()+': '+e.message);
    }
  }

  if(map.size) {
    questions=[...map.values()];
    await idbSet('bank',questions);
    loadDetails=`${questions.length} questões de ${checked} arquivo(s) JSON. ${rejected} arquivo(s) ignorado(s).`;
    setStatus(loadDetails);
  } else {
    const cached=await idbGet('bank');
    questions=Array.isArray(cached)?cached:[];
    loadDetails=questions.length
      ?`GitHub indisponível: ${questions.length} questões recuperadas do cache.`
      :'Não encontrei questões válidas. '+errors.join('; ');
    setStatus(loadDetails);
  }

  activePool=[];
  qIndex=0;
  populateSubjects();
  render();
  updateVR();
}

function subjects() {
  return [...new Set(questions.map(q=>q.disciplina))]
    .sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function populateSubjects() {
  const node=$('subject');
  const old=node.value;
  node.replaceChildren(new Option('Todas',''));
  for(const name of subjects())node.add(new Option(name,name));
  node.value=[...node.options].some(x=>x.value===old)?old:'';
}

function filtered() {
  const s=$('subject').value;
  const term=$('search').value.trim().toLowerCase();
  return questions.filter(q=>
    (!s||q.disciplina===s)&&
    (!term||(q.pergunta+' '+q.assunto+' '+q.disciplina)
      .toLowerCase().includes(term))
  );
}

function pool() {
  if(page==='simulado'&&state.exam)
    return state.exam.ids.map(byId).filter(Boolean);
  if(page==='revisoes')return activePool;
  return activePool.length?activePool:filtered();
}

function current() {
  const a=pool();
  qIndex=Math.max(0,Math.min(qIndex,a.length-1));
  return a[qIndex];
}

function go(p) {
  page=p;
  qIndex=0;
  flipped=false;
  activePool=[];
  render();
}

function count() {
  const n=state.history.length;
  const ok=state.history.filter(x=>x.correct).length;
  return {n,ok,pct:n?Math.round(ok/n*100):0};
}

function answered(q,choice,mode) {
  state.history.push({
    id:q.id,
    disciplina:q.disciplina,
    assunto:q.assunto,
    choice,
    correct:choice===q.correta,
    mode,
    time:now()
  });
  if(state.history.length>15000)
    state.history=state.history.slice(-15000);
  if(choice!==q.correta)
    state.reviews[q.id]={due:now(),interval:1};
  save();
}

function reviewGrade(id,grade) {
  const prev=state.reviews[id]||{interval:1};
  const days=grade===1?1:
    grade===3?Math.max(3,prev.interval*2):
    Math.max(7,prev.interval*3);
  state.reviews[id]={
    interval:days,
    due:now()+days*86400000
  };
  save();
}

function examStart(n) {
  const list=shuffle(filtered()).slice(0,n);
  if(!list.length) {
    setStatus('Banco vazio. Atualize os JSONs.');
    return;
  }
  state.exam={
    ids:list.map(q=>q.id),
    answers:{},
    index:0,
    start:now(),
    minutes:Math.max(0,Number($('examMinutes')?.value)||45)
  };
  page='simulado';
  qIndex=0;
  save();
  render();
}

function examFinish() {
  if(!state.exam)return;
  const e=state.exam;
  let ok=0,wrong=0;
  for(const id of e.ids) {
    const q=byId(id),a=e.answers[id];
    if(!q||a===undefined)continue;
    answered(q,a,'simulado');
    if(a===q.correta)ok++;
    else wrong++;
  }
  const total=e.ids.length;
  state.exams.push({
    date:now(),total,ok,wrong,
    blank:total-ok-wrong
  });
  state.exam=null;
  save();
  go('estatisticas');
  setStatus(`Simulado: ${ok} acertos, ${wrong} erros, ${total-ok-wrong} em branco.`);
}

function changeQuestion(d) {
  const a=pool();
  qIndex=Math.max(0,Math.min(a.length-1,qIndex+d));
  if(state.exam)state.exam.index=qIndex;
  state.answer=null;
  flipped=false;
  save();
  render();
}

function choose(i) {
  const q=current();
  if(!q)return;
  if(page==='simulado'&&state.exam) {
    state.exam.answers[q.id]=i;
    save();
  } else if(state.answer?.id!==q.id) {
    state.answer={id:q.id,choice:i};
    answered(q,i,page);
  }
  render();
}

function favorite() {
  const q=current();
  if(!q)return;
  state.favorites=state.favorites.includes(q.id)
    ?state.favorites.filter(id=>id!==q.id)
    :[...state.favorites,q.id];
  save();
  render();
}

function beginReviews(type) {
  const ids=type==='errors'
    ?new Set(state.history.filter(h=>!h.correct).map(h=>h.id))
    :null;
  activePool=type==='errors'
    ?questions.filter(q=>ids.has(q.id))
    :questions.filter(q=>
      state.reviews[q.id]&&state.reviews[q.id].due<=now());
  page='revisoes';
  qIndex=0;
  render();
}

function download(name,data,type='application/json') {
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=el('a','',document.body);
  a.href=url;
  a.download=name;
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* INTERFACE HTML */

function render() {
  document.querySelectorAll('#nav button').forEach(b=>
    b.classList.toggle('active',b.dataset.page===page)
  );
  const root=$('content');
  root.replaceChildren();
  el('h2',pages.find(x=>x[0]===page)?.[1]||page,root);

  if(page==='inicio') {
    const s=count();
    el('p',`Banco: ${questions.length} questões | Respondidas: ${s.n} | Aproveitamento: ${s.pct}%`,root);
    el('p','No Meta Quest 3S, entre em VR para visualizar o painel e selecionar com controle ou mãos.',root);
    const row=el('div',null,root);
    row.className='row';
    btn('Estudar questões',()=>go('questoes'),row);
    btn('Aulas guiadas',()=>go('aulas'),row);
    btn('Criar simulado',()=>go('simulado'),row);
    btn('Revisões',()=>go('revisoes'),row);
  }

  if(page==='banco') {
    el('p',loadDetails,root);
    el('p',`Repositório: ${REPO}. Os JSONs são buscados na raiz.`,root);
    for(const s of subjects()) {
      el('p',`${s}: ${questions.filter(q=>q.disciplina===s).length} questões`,root);
    }
    btn('Atualizar agora',loadBank,root);
  }

  if(page==='questoes'||page==='aulas'||
     page==='revisoes'||(page==='simulado'&&state.exam)) {
    renderQuestion(root);
  }

  if(page==='simulado'&&!state.exam) {
    el('p','Escolha quantas questões deseja responder. O simulado registra acertos, erros e questões em branco.',root);
    el('label','Tempo em minutos',root);
    const inp=el('input',null,root);
    inp.id='examMinutes';
    inp.type='number';
    inp.value='45';
    inp.min='0';
    const row=el('div',null,root);
    row.className='row';
    for(const n of [10,20,50,100])
      btn(`${n} questões`,()=>examStart(n),row);
  }

  if(page==='flashcards') {
    const list=filtered();
    const q=list[qIndex%Math.max(list.length,1)];
    if(!q) {
      el('p','Nenhuma questão disponível.',root);
    } else {
      el('p',`${qIndex+1}/${list.length} — ${q.disciplina}`,root);
      el('div',flipped
        ?`Resposta: ${q.alternativas[q.correta]}\n${q.explicacao}`
        :q.pergunta,root).className='question';
      const row=el('div',null,root);
      row.className='row';
      btn(flipped?'Ocultar resposta':'Virar cartão',()=>{
        flipped=!flipped;render();
      },row);
      for(const [t,v] of [['Difícil',1],['Bom',3],['Fácil',5]]) {
        btn(t,()=>{
          reviewGrade(q.id,v);
          qIndex=(qIndex+1)%list.length;
          flipped=false;
          render();
        },row);
      }
      btn('Próximo',()=>{
        qIndex=(qIndex+1)%list.length;
        flipped=false;
        render();
      },row);
    }
  }

  if(page==='revisoes'&&!pool().length) {
    el('p','Sem revisões nesta seleção.',root);
  }

  if(page==='estatisticas') {
    const s=count();
    el('p',`Respondidas: ${s.n} | Acertos: ${s.ok} | Erros: ${s.n-s.ok} | Aproveitamento: ${s.pct}%`,root);
    for(const subj of subjects()) {
      const a=state.history.filter(h=>h.disciplina===subj);
      if(a.length)el('p',`${subj}: ${a.filter(h=>h.correct).length}/${a.length}`,root);
    }
    el('h3','Últimos simulados',root);
    for(const e of state.exams.slice(-10).reverse()) {
      el('p',`${new Date(e.date).toLocaleDateString('pt-BR')}: ${e.ok}/${e.total} | ${e.blank} em branco`,root);
    }
    btn('Exportar histórico CSV',()=>{
      const rows=['disciplina,assunto,correta,data'];
      for(const h of state.history) {
        rows.push(
          [h.disciplina,h.assunto,h.correct,new Date(h.time).toISOString()]
          .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')
        );
      }
      download('pmsc-historico.csv',rows.join('\n'),'text/csv');
    },root);
  }

  if(page==='config') {
    el('p','Os dados de desempenho são guardados neste navegador. Faça backup para transferir de aparelho.',root);
    const row=el('div',null,root);
    row.className='row';
    btn('Tema claro/escuro',()=>{
      state.theme=state.theme==='light'?'dark':'light';
      document.body.classList.toggle('light',state.theme==='light');
      save();render();
    },row);
    btn('Exportar backup JSON',()=>
      download('pmsc-backup.json',JSON.stringify(state,null,2)),row);
    const f=el('input',null,root);
    f.type='file';
    f.accept='.json';
    f.onchange=async()=>{
      try {
        if(f.files[0].size>5000000)throw Error('Arquivo grande demais');
        const o=JSON.parse(await f.files[0].text());
        if(!Array.isArray(o.history)||!Array.isArray(o.favorites))
          throw Error('Backup inválido');
        state={...initial,...o};
        save();render();
        setStatus('Backup restaurado');
      } catch(e) {
        setStatus(e.message);
      }
    };
    el('p','Selecione um backup JSON acima para restaurar.',root);
  }

  if(page==='revisoes') {
    const row=el('div',null,root);
    row.className='row';
    btn('Revisões vencidas',()=>beginReviews('due'),row);
    btn('Caderno de erros',()=>beginReviews('errors'),row);
  }

  updateVR();
}

function renderQuestion(root) {
  const list=pool();
  const q=current();
  if(!q) {
    el('p','Nenhuma questão encontrada. Selecione outra disciplina ou atualize o JSON.',root);
    return;
  }
  const exam=page==='simulado'&&state.exam;
  el('p',`${qIndex+1} de ${list.length} • ${q.disciplina} • ${q.assunto}`,root);
  if(exam&&state.exam.minutes) {
    const remain=Math.max(0,state.exam.minutes*60000-(now()-state.exam.start));
    el('p',`Tempo restante: ${Math.ceil(remain/60000)} minuto(s)`,root);
  }
  el('div',q.pergunta,root).className='question';
  const ans=exam
    ?state.exam.answers[q.id]
    :state.answer?.id===q.id?state.answer.choice:undefined;

  if(page==='aulas') {
    el('p','Aula guiada: leia a questão, consulte o gabarito e a explicação disponível no arquivo JSON.',root);
    el('p',`Resposta: ${q.alternativas[q.correta]}`,root);
    if(q.explicacao)el('p',q.explicacao,root);
  } else {
    for(let i=0;i<q.alternativas.length;i++) {
      const b=btn(q.alternativas[i],()=>choose(i),root);
      b.className='option';
      if(ans!==undefined) {
        if(exam&&ans===i)b.classList.add('active');
        if(!exam) {
          if(i===q.correta)b.classList.add('correct');
          if(ans===i&&i!==q.correta)b.classList.add('wrong');
        }
      }
    }
  }
  if(ans!==undefined&&!exam) {
    el('p',ans===q.correta?'Resposta correta!':'Resposta incorreta.',root);
    if(q.explicacao)el('p',q.explicacao,root);
    if(q.referencia)el('p',`Referência: ${q.referencia}`,root);
  }
  const row=el('div',null,root);
  row.className='row';
  btn('◀ Anterior',()=>changeQuestion(-1),row);
  btn('Próxima ▶',()=>changeQuestion(1),row);
  btn(state.favorites.includes(q.id)?'★ Favorita':'☆ Favoritar',favorite,row);
  if(exam)btn('Finalizar simulado',examFinish,row);
}

function perform(action) {
  if(action.startsWith('go:'))return go(action.slice(3));
  if(action.startsWith('answer:'))return choose(Number(action.slice(7)));
  if(action.startsWith('exam:'))return examStart(Number(action.slice(5)));
  if(action.startsWith('grade:')) {
    const q=filtered()[qIndex];
    if(q)reviewGrade(q.id,Number(action.slice(6)));
    qIndex++;
    flipped=false;
    return render();
  }
  switch(action) {
    case 'next':return changeQuestion(1);
    case 'prev':return changeQuestion(-1);
    case 'favorite':return favorite();
    case 'flip':flipped=!flipped;return render();
    case 'finish':return examFinish();
    case 'refresh':return loadBank();
    case 'reviewDue':return beginReviews('due');
    case 'reviewErrors':return beginReviews('errors');
    case 'sceneNext':
      $('env').value=(Number($('env').value)+1)%envs.length;
      return changeEnv(Number($('env').value));
    case 'scenePrev':
      $('env').value=(Number($('env').value)+envs.length-1)%envs.length;
      return changeEnv(Number($('env').value));
    case 'theme':
      state.theme=state.theme==='light'?'dark':'light';
      document.body.classList.toggle('light',state.theme==='light');
      save();
      return render();
  }
}

function rect(x,y,w,h,r=12) {
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function wordLines(text,width,font='25px Arial') {
  ctx.font=font;
  const lines=[];
  for(const piece of String(text).split('\n')) {
    let line='';
    for(const word of piece.split(/\s+/)) {
      const trial=line?line+' '+word:word;
      if(ctx.measureText(trial).width>width&&line) {
        lines.push(line);
        line=word;
      } else {
        line=trial;
      }
    }
    lines.push(line);
  }
  return lines;
}

function drawText(text,x,y,width,limit=5,size=28,color='#efffe9',gap=35) {
  ctx.fillStyle=color;
  ctx.font=`${size}px Arial`;
  let lines=wordLines(text,width,`${size}px Arial`);
  const cut=lines.length>limit;
  lines=lines.slice(0,limit);
  if(cut) {
    lines[limit-1]=lines[limit-1]
      .slice(0,Math.max(0,lines[limit-1].length-4))+'...';
  }
  for(const line of lines) {
    ctx.fillText(line,x,y);
    y+=gap;
  }
  return y;
}

function hitUV(uv) {
  const x=uv.x*W,y=(1-uv.y)*H;
  return hotspots.findIndex(h=>
    x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h);
}

function doHit(hit) {
  if(now()-lastSelect<450)return false;
  const ix=hitUV(hit.uv);
  if(ix<0)return false;
  lastSelect=now();
  perform(hotspots[ix].action);
  return true;
}

/* CONTROLES E MÃOS */

const raycaster=new THREE.Raycaster();
const mat4=new THREE.Matrix4();
const orig=new THREE.Vector3();
const direction=new THREE.Vector3();

function rayFrom(obj) {
  obj.updateWorldMatrix(true,false);
  mat4.identity().extractRotation(obj.matrixWorld);
  orig.setFromMatrixPosition(obj.matrixWorld);
  direction.set(0,0,-1).applyMatrix4(mat4).normalize();
  raycaster.set(orig,direction);
}

function selectFrom(obj) {
  rayFrom(obj);
  const panelHit=raycaster.intersectObject(panel)[0];
  if(panelHit&&doHit(panelHit))return;

  const floorHit=raycaster.intersectObject(floor)[0];
  if(floorHit&&floorHit.distance<12) {
    const p=floorHit.point;
    if(Math.abs(p.x)<11&&Math.abs(p.z)<11) {
      rig.position.x=p.x;
      rig.position.z=p.z;
      setStatus('Posição alterada pelo teletransporte.');
    }
  }
}

function handSelect(hand) {
  if(!renderer.xr.isPresenting)return;

  const tip=hand.joints?.['index-finger-tip'];
  const wrist=hand.joints?.wrist;
  if(!tip)return;

  tip.updateWorldMatrix(true,false);
  const p=new THREE.Vector3().setFromMatrixPosition(tip.matrixWorld);
  const local=panel.worldToLocal(p.clone());

  if(Math.abs(local.z)<.12&&Math.abs(local.x)<1.4&&Math.abs(local.y)<1.16) {
    const u=local.x/2.8+.5;
    const v=local.y/2.33+.5;
    doHit({uv:{x:u,y:v}});
    return;
  }

  if(wrist) {
    wrist.updateWorldMatrix(true,false);
    const w=new THREE.Vector3().setFromMatrixPosition(wrist.matrixWorld);
    const dir=p.clone().sub(w).normalize();
    raycaster.set(p,dir);
    const hit=raycaster.intersectObject(panel)[0];
    if(hit)doHit(hit);
  }
}

/* MOTOR THREE.JS */

function init3D() {
  scene=new THREE.Scene();
  scene.background=new THREE.Color('#8eb1bf');
  scene.add(new THREE.HemisphereLight(0xffffff,0x345342,2.2));

  const sun=new THREE.DirectionalLight(0xffffff,1.8);
  sun.position.set(4,9,4);
  scene.add(sun);

  rig=new THREE.Group();
  scene.add(rig);

  camera=new THREE.PerspectiveCamera(65,1,.1,120);
  camera.position.set(0,1.65,7);
  rig.add(camera);

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.xr.enabled=true;
  $('scene').append(renderer.domElement);

  texture=new THREE.CanvasTexture(board);
  texture.colorSpace=THREE.SRGBColorSpace;

  panel=new THREE.Mesh(
    new THREE.PlaneGeometry(2.8,2.33),
    new THREE.MeshBasicMaterial({
      map:texture,
      side:THREE.DoubleSide
    })
  );
  panel.position.set(0,1.67,-2.5);
  rig.add(panel);
  panel.visible=false;

  for(let i=0;i<2;i++) {
    const c=renderer.xr.getController(i);
    c.addEventListener('select',()=>selectFrom(c));
    const points=[
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(0,0,-7)
    ];
    c.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({color:0x8affba})
    ));
    rig.add(c);
    controllers.push(c);

    const grip=renderer.xr.getControllerGrip(i);
    try {
      grip.add(new XRControllerModelFactory().createControllerModel(grip));
    } catch {}
    rig.add(grip);

    const hand=renderer.xr.getHand(i);
    try {
      hand.add(new XRHandModelFactory().createHandModel(hand,'spheres'));
    } catch {}
    rig.add(hand);
    hand.addEventListener('select',()=>handSelect(hand));
    hands.push({hand,pinched:false});
  }

  const vrBtn=VRButton.createButton(renderer,{
    optionalFeatures:[
      'hand-tracking',
      'local-floor',
      'bounded-floor'
    ]
  });
  vrBtn.style.display='none';
  document.body.append(vrBtn);

  $('enterVR').onclick=()=>{
    if(!navigator.xr) {
      setStatus('WebXR indisponível. Abra pelo navegador do Meta Quest.');
      return;
    }
    vrBtn.click();
  };

  renderer.xr.addEventListener('sessionstart',()=>{
    panel.visible=true;
    updateVR();
    setStatus('VR iniciada. Use controle ou pinça.');
  });

  renderer.xr.addEventListener('sessionend',()=>{
    panel.visible=false;
    setStatus('VR encerrada.');
  });

  changeEnv(state.env);

  renderer.setAnimationLoop(()=>{
    const dom=$('scene');
    const w=dom.clientWidth,h=dom.clientHeight;

    if(w&&h) {
      const ratio=renderer.getPixelRatio();
      if(renderer.domElement.width!==Math.round(w*ratio)||
         renderer.domElement.height!==Math.round(h*ratio)) {
        renderer.setSize(w,h,false);
        camera.aspect=w/h;
        camera.updateProjectionMatrix();
      }
    }

    if(renderer.xr.isPresenting) {
      const tick=Math.floor(now()/1000);
      if(state.exam?.minutes&&tick!==lastSecond) {
        lastSecond=tick;
        if(now()-state.exam.start>=state.exam.minutes*60000)
          examFinish();
        else updateVR();
      }

      for(const o of hands) {
        const hand=o.hand;
        const t=hand.joints?.['thumb-tip'];
        const f=hand.joints?.['index-finger-tip'];

        if(t&&f&&hand.visible) {
          t.updateWorldMatrix(true,false);
          f.updateWorldMatrix(true,false);
          const a=new THREE.Vector3().setFromMatrixPosition(t.matrixWorld);
          const b=new THREE.Vector3().setFromMatrixPosition(f.matrixWorld);
          const near=a.distanceTo(b)<.027;
          if(near&&!o.pinched)handSelect(hand);
          o.pinched=near;
        }
      }

      let over=-1;
      for(const c of controllers) {
        rayFrom(c);
        const hit=raycaster.intersectObject(panel)[0];
        if(hit) {
          over=hitUV(hit.uv);
          if(over>=0)break;
        }
      }
      if(over!==hovered) {
        hovered=over;
        vrDraw();
      }
    }

    renderer.render(scene,camera);
  });
}

function updateVR() {
  if(texture)vrDraw();
}

/* OBJETOS 3D */

function cube(parent,x,y,z,w,h,d,color) {
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color})
  );
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

function column(parent,x,z) {
  cube(parent,x,1.5,z,.26,3,.26,'#718076');
}

function flag(parent,x,z) {
  cube(parent,x,2,z,.06,4,.06,'#b0bdb3');
  cube(parent,x+.7,3.25,z,1.4,.85,.05,'#159a4b');
  const dia=cube(parent,x+.7,3.25,z+.04,.62,.62,.045,'#efd336');
  dia.rotation.z=Math.PI/4;
  const ball=new THREE.Mesh(
    new THREE.SphereGeometry(.23,16,12),
    new THREE.MeshStandardMaterial({color:'#16429b'})
  );
  ball.position.set(x+.7,3.25,z+.08);
  ball.scale.z=.12;
  parent.add(ball);
}

/* DEZ AMBIENTES */

function changeEnv(n) {
  state.env=(n+envs.length)%envs.length;
  save();

  if(room) {
    scene.remove(room);
    room.traverse(o=>{
      o.geometry?.dispose();
      if(o.material) {
        const mats=Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>m.dispose());
      }
    });
  }

  room=new THREE.Group();
  scene.add(room);

  floor=cube(room,0,-.12,0,26,.24,26,
    n===3?'#527d43':'#74847b');

  if(n!==3)
    cube(room,0,3,-10,23,6,.3,'#a3b1aa');

  flag(room,-8,-8);

  switch(n) {
    case 0:
      for(let x=-4;x<=4;x+=2)
        cube(room,x,.01,-2,.12,.03,6,'#eadfba');
      cube(room,0,1.8,-9,7,3,.4,'#52695e');
      break;

    case 1:
    case 7:
      for(let x=-4;x<=4;x+=2) {
        for(let z=-5;z<=2;z+=2) {
          cube(room,x,.7,z,1.4,.14,.7,'#786043');
          cube(room,x,.3,z,.12,.6,.1,'#56645c');
        }
      }
      cube(room,0,2.4,-9.6,6,2,.08,'#21513e');
      break;

    case 2:
      cube(room,-4,1.7,-7,4,3.4,3,'#c0b7a8');
      for(let x=-1;x<=7;x+=.9)column(room,x,-8);
      break;

    case 3:
      for(let x=-8;x<=8;x+=4)
        cube(room,x,.6,-5,2,1.2,1.1,'#988160');
      for(let z=-3;z<=3;z+=2)
        cube(room,-5,.3,z,3,.5,.25,'#8a7052');
      break;

    case 4:
      for(let x=-6;x<=6;x+=3) {
        for(const z of [-5,1]) {
          cube(room,x,.5,z,1.5,.17,2.2,'#778987');
          cube(room,x,1.5,z,1.5,.17,2.2,'#778987');
          column(room,x-.7,z-1);
        }
      }
      break;

    case 5:
      for(let x=-5;x<=5;x+=2.5)
        cube(room,x,1.3,-7,2.1,2.6,.65,'#755d47');
      break;

    case 6:
      for(let z=-6;z<=1;z+=2) {
        for(let x=-5;x<=5;x+=2)
          cube(room,x,.65,z,1.4,.8,.7,'#6c6256');
      }
      cube(room,0,.5,-9,7,1,2,'#75694b');
      break;

    case 8:
      for(let x=-8;x<=8;x+=4)column(room,x,-7);
      cube(room,0,.5,-7,6,1,2,'#839e8d');
      break;

    case 9:
      for(let x=-6;x<=6;x+=3)
        cube(room,x,.8,-5,2.3,.2,.8,'#4b6861');
      cube(room,0,2.4,-9.6,8,2,.1,'#1c3d39');
      break;
  }

  $('env').value=String(state.env);
  updateVR();
}

$('search').oninput=()=>{
  qIndex=0;
  activePool=[];
  render();
};

$('reload').onclick=loadBank;

(async()=>{
  db=await dbOpen();

  const backed=await idbGet('progress');
  if(backed&&!state.history.length&&Array.isArray(backed.history)) {
    state={...initial,...backed};
  }

  document.body.classList.toggle(
    'light',
    state.theme==='light'
  );

  init3D();
  populateSubjects();
  render();

  await loadBank();

})().catch(e=>{
  console.error(e);
  setStatus('Erro ao iniciar: '+e.message);
});

</script>
</body>
</html>
