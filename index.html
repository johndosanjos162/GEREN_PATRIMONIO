<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071711">
<title>PM-SC Immersive Academy 2026</title>

<style>
:root{
 --bg:#071711;--panel:#10251d;--panel2:#19362a;
 --text:#f1f8f3;--muted:#b4c7bb;--accent:#54e5a0;
 --border:#365b49;--danger:#ff7777;--gold:#e8c879;--font:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:system-ui,Arial,sans-serif;font-size:var(--font)}
button,input,select{font:inherit}
button,select,input{background:var(--panel2);color:var(--text);
 border:1px solid var(--border);border-radius:9px;padding:10px}
button{cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
header{background:#10261c;border-bottom:1px solid var(--border);
 padding:17px;display:flex;align-items:center;justify-content:space-between;
 gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem}
header small{color:var(--muted)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);
 min-height:calc(100vh - 80px)}
aside{background:var(--panel);border-right:1px solid var(--border);padding:16px}
nav{display:grid;gap:7px}
nav button{text-align:left}
nav button.active{background:#24563d;border-color:var(--accent)}
main{padding:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--border);
 border-radius:15px;padding:18px;margin-bottom:15px}
.card h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.metric{background:var(--panel2);border-radius:12px;padding:15px}
.metric strong{display:block;font-size:1.7rem;color:var(--accent)}
.metric span{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
.field{display:grid;gap:6px;margin:10px 0}
.field label{color:var(--muted)}
.question{font-size:1.13rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.option{display:block;width:100%;text-align:left;padding:15px;margin:9px 0;
 line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.option.selected{border:2px solid var(--accent)}
.option.correct{border-color:#6affaa;background:#174c32}
.option.wrong{border-color:var(--danger);background:#4b2525}
.explanation{border-left:4px solid var(--accent);background:var(--panel2);
 padding:15px;margin-top:15px;line-height:1.6;white-space:pre-wrap}
#scene{width:100%;height:340px;overflow:hidden;border-radius:12px;
 background:#162b25;position:relative}
#scene canvas{display:block}
#status{color:var(--muted);font-size:.9rem}
progress{width:100%;height:15px;accent-color:var(--accent)}
.badge{display:inline-block;border:1px solid var(--border);
 padding:5px 9px;border-radius:20px;color:var(--muted);margin:3px}
.flashcard{min-height:240px;display:grid;place-items:center;text-align:center;
 padding:25px;background:linear-gradient(135deg,#174b36,#112c25);
 border:1px solid var(--accent);border-radius:16px;cursor:pointer;
 white-space:pre-wrap;line-height:1.7;font-size:1.15rem}
.bar{height:12px;background:#294536;border-radius:20px;
 overflow:hidden;margin:7px 0 15px}
.bar span{display:block;height:100%;background:var(--accent)}
.notice{padding:12px;border:1px solid var(--border);
 border-radius:10px;margin:10px 0;color:var(--muted)}
body.light{--bg:#edf4ef;--panel:#ffffff;--panel2:#e1eee5;
 --text:#16291e;--muted:#42604c;--accent:#087b47;--border:#9db9a6}
body.blue{--bg:#071323;--panel:#10243c;--panel2:#193856;
 --text:#f0f7ff;--muted:#b8d0e5;--accent:#64c8ff;--border:#345e80}
body.purple{--bg:#160d25;--panel:#281b3c;--panel2:#39264e;
 --text:#f8f2ff;--muted:#d2c2e8;--accent:#c69aff;--border:#6c4c89}
body.contrast{--bg:#000;--panel:#111;--panel2:#222;
 --text:#fff;--muted:#fff;--accent:#ffff00;--border:#fff}
body.focus aside,body.focus #sceneCard{display:none}
body.focus .layout{grid-template-columns:1fr}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 aside{border-right:0}
 nav{grid-template-columns:repeat(2,1fr)}
 #scene{height:260px}
 main{padding:10px}
}
</style>
</head>

<body>

<header>
 <div>
  <h1>🇧🇷 PM-SC Immersive Academy 2026</h1>
  <small>Academia de Estudos em Realidade Virtual</small>
 </div>
 <span id="status">Inicializando...</span>
</header>

<div class="layout">

<aside>
 <nav id="menu"></nav>

 <div class="field">

  <select id="environment"></select>
 </div>
 <div class="field">
  <label for="theme">Tema visual</label>
  <select id="theme">

   <option value="purple">Roxo futurista</option>

<main>

  <h2>Ambiente tridimensional</h2>
  <div id="scene"></div>
  <div class="controls">
   <button id="rotateLeft">◀ Girar</button>

  </div>
 </section>

</main>

{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",

<script type="module">

import * as THREE from "three";
import {VRButton} from "three/addons/webxr/VRButton.js";

/* ═══════════════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════════════ */

const APP={
 repo:"johndosanjos162/PMSC",
 branches:["main","master"],
 storageKey:"PMSC_ACADEMY_V3",
 directJsonUrl:""
};

const $=id=>document.getElementById(id);
const now=()=>Date.now();

const environments=[
 "Pátio de Formatura","Sala de Instrução Militar","Entrada do Quartel",
 "Campo de Treinamento","Alojamento Militar"
];

const pages=[
 "Início","Estudos","Simulados","Flashcards",
 "Revisões","Desempenho","Banco de Questões","Configurações"
];

const defaults={
 environment:0,theme:"dark",quality:"medium",fontSize:16,
 history:[],favorites:[],reviews:{},exams:[],flashcards:{},
 session:null,activeExam:null
};

const VALID_THEMES=["dark","blue","purple","light","contrast"];
const VALID_QUALITY=["low","medium","high"];

let state,questions=[],page="Início",currentIndex=0,studyPool=[];
let exam=null,examTimerId=null,finishingExam=false,flashBack=false,loadBusy=false;

function status(m){ $("status").textContent=m; }
function save(){ try{ localStorage.setItem(APP.storageKey,JSON.stringify(state)); }catch(e){} }
function cloneDefaults(){ return JSON.parse(JSON.stringify(defaults)); }

const StorageManager={
 load(){
  try{
   const data=JSON.parse(localStorage.getItem(APP.storageKey)||"{}");
   const m={...cloneDefaults(),...data};
   if(!VALID_THEMES.includes(m.theme)) m.theme="dark";
   if(!VALID_QUALITY.includes(m.quality)) m.quality="medium";
   if(typeof m.environment!=="number"||m.environment<0||m.environment>=environments.length) m.environment=0;
   if(typeof m.fontSize!=="number"||m.fontSize<10||m.fontSize>40) m.fontSize=16;
   if(!m.session) m.session=null;
   if(!m.activeExam) m.activeExam=null;
   return m;
  }catch{ return cloneDefaults(); }
 },
 export(){ download("backup-pmsc.json",JSON.stringify(state,null,2),"application/json"); },
 async restore(file){
  if(!file||file.size>3000000) throw Error("Arquivo inválido.");
  const data=JSON.parse(await file.text());
  if(!data||!Array.isArray(data.history)||!Array.isArray(data.favorites)) throw Error("Backup incompatível.");
  if(examTimerId){ clearInterval(examTimerId); examTimerId=null; }
  exam=null;
  state={...cloneDefaults(),...data};
  state.activeExam=null;
  save(); applySettings(); render();
 }
};
state=StorageManager.load();

/* ═══════════════════════════════════════════════════════════════════
   PARSER
═══════════════════════════════════════════════════════════════════ */

function looksLikeQuestion(obj){
 if(!obj||typeof obj!=="object"||Array.isArray(obj)) return false;
 const qKeys=["pergunta","enunciado","question","questao","texto","statement","title","text","descricao","wording","body"];
 if(!qKeys.some(k=>obj[k]&&typeof obj[k]==="string"&&obj[k].trim().length>=3)) return false;
 const oKeys=["alternativas","opcoes","options","choices","respostas","items","opcoes_resposta","alternatives","possibilidades","answers"];
 if(!oKeys.some(k=>obj[k]&&(Array.isArray(obj[k])||typeof obj[k]==="object"||typeof obj[k]==="string"))){
  const letters=["a","b","c","d","e","A","B","C","D","E"];
  if(letters.filter(l=>obj[l]!==undefined).length<2) return false;
 }
 return true;
}

function deepFindQuestions(data,depth=0){
 if(depth>6||!data) return [];
 if(Array.isArray(data)){
  if(data.length>0 && data.every(item=>looksLikeQuestion(item))) return data;
  let found=[];
  for(const item of data) found.push(...deepFindQuestions(item,depth+1));
  return found;
 }
 if(typeof data==="object"){
  if(looksLikeQuestion(data)) return [data];
  const keys=["questoes","questions","perguntas","dados","data","items","banco","bank","lista","list","conteudo","content","exercicios","exercises","problemas","problems"];
  for(const key of keys){
   if(data[key]){
    const found=deepFindQuestions(data[key],depth+1);
    if(found.length>0) return found;
   }
  }
  let found=[];
  for(const v of Object.values(data)) found.push(...deepFindQuestions(v,depth+1));
  return found;
 }
 return [];
}

function normalizeQuestion(raw,fb){
 fb=fb||"Geral";
 if(!raw||typeof raw!=="object") return null;
 const qKeys=["pergunta","enunciado","question","questao","texto","statement","title","text","descricao","wording","body"];
 let texto="";
 for(const k of qKeys){
  if(raw[k]&&typeof raw[k]==="string"&&raw[k].trim().length>=3){ texto=raw[k].trim(); break; }
 }
 if(!texto) return null;

 const oKeys=["alternativas","opcoes","options","choices","respostas","items","opcoes_resposta","alternatives","possibilidades","answers"];
 let optsRaw=null;
 for(const k of oKeys){ if(raw[k]){ optsRaw=raw[k]; break; } }

 let alts=[];
 if(Array.isArray(optsRaw)){
  alts=optsRaw.map(o=>{
   if(typeof o==="string") return o.trim();
   if(typeof o==="number") return String(o);
   if(typeof o==="object"&&o!==null) return String(o.texto??o.text??o.valor??o.value??o.label??"").trim();
   return "";
  }).filter(a=>a.length>0);
 }else if(typeof optsRaw==="string"){
  let parts=optsRaw.split(/\n|\|/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2) parts=optsRaw.split(/(?=[A-Ea-e]\s*[\)\.\-\:])/).map(s=>s.trim()).filter(Boolean);
  alts=parts;
 }else if(optsRaw&&typeof optsRaw==="object"){
  alts=Object.values(optsRaw).map(o=>{
   if(typeof o==="string") return o.trim();
   if(typeof o==="number") return String(o);
   if(typeof o==="object"&&o!==null) return String(o.texto??o.text??o.valor??o.value??"").trim();
   return "";
  }).filter(a=>a.length>0);
 }
 if(alts.length<2){
  const letters=["a","b","c","d","e","A","B","C","D","E"];
  const found=[];
  for(const l of letters) if(raw[l]!==undefined) found.push(String(raw[l]).trim());
  if(found.length>=2) alts=found;
 }
 if(alts.length<2) return null;

 const prefix=/^([A-Ea-e])\s*[\)\.\-\:]\s*/;
 if(alts.every((a,i)=>{ const m=String(a).match(prefix); return m&&m[1].toUpperCase()==="ABCDE"[i]; })){
  alts=alts.map(a=>a.replace(prefix,"").trim());
 }
 if(alts.length<2) return null;

 const aKeys=["correta","correct","gabarito","answer","resposta","right","answerIndex"];
 let cRaw=null;
 for(const k of aKeys){ if(raw[k]!==undefined){ cRaw=raw[k]; break; } }

 let correct=-1;
 if(typeof cRaw==="number") correct=cRaw;
 else if(typeof cRaw==="string"){
  const v=cRaw.trim().toUpperCase();
  if(/^[A-E]$/.test(v)) correct=v.charCodeAt(0)-65;
  else if(/^\d+$/.test(v)) correct=Number(v);
  else {
   const idx=alts.findIndex(a=>a.toLowerCase()===cRaw.toLowerCase().trim());
   if(idx>=0) correct=idx;
  }
 }
 if(!Number.isInteger(correct)||correct<0||correct>=alts.length) return null;

 const sKeys=["disciplina","materia","subject","area","category","topic","assunto"];
 let disc=fb;
 for(const k of sKeys){
  if(raw[k]&&typeof raw[k]==="string"&&raw[k].trim()){ disc=raw[k].trim(); break; }
 }

 return {
  id:String(raw.id??raw.codigo??`${disc}:${texto.slice(0,60)}`),
  disciplina:disc,
  assunto:String(raw.assunto??raw.topic??"Geral"),
  dificuldade:String(raw.dificuldade??raw.difficulty??"media"),
  enunciado:texto,
  alternativas:alts.map(String),
  correta:correct,
  explicacao:String(raw.explicacao??raw.explanation??raw.comentario??""),
  referencia:String(raw.referencia??raw.reference??"")
 };
}

function analyzeStructure(data){
 if(data===null) return "null";
 if(Array.isArray(data)){
  if(data.length===0) return "array vazio";
  const f=data[0];
  if(typeof f==="object"&&f!==null) return `array[${data.length}] · chaves: [${Object.keys(f).slice(0,6).join(", ")}]`;
  return `array[${data.length}]`;
 }
 if(typeof data==="object") return `objeto · chaves: [${Object.keys(data).slice(0,8).join(", ")}]`;
 return typeof data;
}

const QuestionManager={
 deduplicate(list){
  const ids=new Set();
  return list.filter(q=>{ if(ids.has(q.id)) return false; ids.add(q.id); return true; });
 },
 find(id){ return questions.find(q=>q.id===id); }
};

/* ═══════════════════════════════════════════════════════════════════
   CARREGAMENTO
═══════════════════════════════════════════════════════════════════ */

function fetchWithTimeout(url,opts={},ms=10000){
 return new Promise((res,rej)=>{
  const c=new AbortController();
  const t=setTimeout(()=>{c.abort();rej(Error("Timeout"));},ms);
  fetch(url,{...opts,signal:c.signal})
   .then(r=>{clearTimeout(t);res(r);})
   .catch(e=>{clearTimeout(t);rej(e);});
 });
}
async function fetchJson(url){
 const r=await fetchWithTimeout(url,{},10000);
 if(!r.ok) throw Error(`HTTP ${r.status}`);
 const text=await r.text();
 if(text.length>5000000) throw Error("JSON >5MB");
 if(!text.trim()) throw Error("Arquivo vazio");
 try{ return JSON.parse(text); }catch(e){ throw Error("JSON inválido"); }
}

const ContentRepository={
 _lastDebug:{steps:[],errors:[],filesInfo:[],filesLoaded:[]},

 async load(){
  if(loadBusy) return;
  loadBusy=true;
  const debug={steps:[],errors:[],filesInfo:[],filesLoaded:[],urlTried:[],filesFound:[]};
  function step(m){ debug.steps.push(m); status(m); console.log("[REPO]",m); }
  function err(m){ debug.errors.push(m); console.warn("[REPO-ERR]",m); }

  try{
   step("Iniciando busca do banco...");
   let loaded=[];

   if(APP.directJsonUrl){
    step("Testando URL direta...");
    try{
     const json=await fetchJson(APP.directJsonUrl);
     const est=analyzeStructure(json);
     const items=deepFindQuestions(json);
     let ok=0,rej=0;
     for(const item of items){
      const q=normalizeQuestion(item);
      if(q){ loaded.push(q); ok++; } else rej++;
     }
     debug.filesInfo.push({name:"URL direta",structure:est,candidates:items.length,valid:ok,rejected:rej});
     debug.filesLoaded.push(APP.directJsonUrl);
     step(`URL direta: ${ok} válidas · ${est}`);
    }catch(e){ err("URL direta: "+e.message); }
   }

   if(!loaded.length){
    for(const branch of APP.branches){
     step(`API GitHub (${APP.repo} / ${branch})...`);
     try{
      const url=`https://api.github.com/repos/${APP.repo}/contents/?ref=${branch}`;
      const r=await fetchWithTimeout(url,{headers:{Accept:"application/vnd.github+json"}},10000);
      if(!r.ok){
       if(r.status===404) err(`${branch}: repositório/branch inexistente`);
       else if(r.status===403) err(`${branch}: rate limit API`);
       else err(`${branch}: HTTP ${r.status}`);
       continue;
      }
      const list=await r.json();
      if(!Array.isArray(list)){ err("API não retornou lista"); continue; }
      const jsonFiles=list.filter(f=>
       f.type==="file"&&f.name.toLowerCase().endsWith(".json")&&
       !f.name.startsWith(".")&&f.name!=="manifest.json"&&
       f.name!=="package.json"&&f.name!=="package-lock.json"
      );
      debug.filesFound.push(...jsonFiles.map(f=>f.name));
      step(`${jsonFiles.length} .json em ${branch}: ${jsonFiles.map(f=>f.name).join(", ")}`);
      for(const file of jsonFiles){
       try{
        const json=await fetchJson(file.download_url);
        const est=analyzeStructure(json);
        const items=deepFindQuestions(json);
        let ok=0,rej=0;
        for(const item of items){
         const q=normalizeQuestion(item);
         if(q){ loaded.push(q); ok++; } else rej++;
        }
        debug.filesInfo.push({name:file.name,branch,structure:est,candidates:items.length,valid:ok,rejected:rej});
        if(ok>0){ debug.filesLoaded.push(file.name); step(`✓ ${file.name}: ${ok} válidas`); }
        else step(`✗ ${file.name}: ${items.length} candidatos · 0 válidas`);
       }catch(e){ err(`${file.name}: ${e.message}`); }
      }
      if(loaded.length) break;
     }catch(e){ err(`API (${branch}): ${e.message}`); }
    }
   }

   if(!loaded.length){
    const names=["json.json","questoes.json","questions.json","banco.json","pmsc.json"];
    for(const branch of APP.branches){
     if(loaded.length) break;
     step(`Nomes comuns em ${branch}...`);
     for(const name of names){
      const url=`https://raw.githubusercontent.com/${APP.repo}/${branch}/${name}`;
      try{
       const json=await fetchJson(url);
       const est=analyzeStructure(json);
       const items=deepFindQuestions(json);
       let ok=0;
       for(const item of items){
        const q=normalizeQuestion(item);
        if(q){ loaded.push(q); ok++; }
       }
       if(ok>0){
        debug.filesInfo.push({name,branch,structure:est,candidates:items.length,valid:ok,rejected:0});
        debug.filesLoaded.push(name);
        step(`✓ ${name}: ${ok} válidas · ${est}`);
        break;
       }
      }catch(e){}
     }
    }
   }

   if(!loaded.length){
    step("Tentando cache local...");
    try{
     const cached=JSON.parse(localStorage.getItem(APP.storageKey+"_BANK")||"[]");
     if(cached.length){ loaded=cached; step(`Cache: ${cached.length}`); }
    }catch(e){}
   }

   loaded=QuestionManager.deduplicate(loaded);
   this._lastDebug=debug;

   if(loaded.length){
    questions=loaded;
    try{ localStorage.setItem(APP.storageKey+"_BANK",JSON.stringify(questions)); }catch{}
    status(`✅ ${loaded.length} questões · ${debug.filesLoaded.length} arquivo(s)`);
    if(vrManager && vrManager.isActive()) vrManager.showHome();
   }else{
    status("❌ 0 questões. Veja Banco de Questões.");
   }

   if(page==="Estudos") studyPool=[];
   render();
  }finally{
   loadBusy=false;
  }
 },

 getDebug(){ return this._lastDebug; }
};

/* ═══════════════════════════════════════════════════════════════════
   STATS / REVIEW / SM-2
═══════════════════════════════════════════════════════════════════ */

const StatisticsManager={
 summary(){
  const h=state.history;
  const c=h.filter(x=>x.correct).length;
  return {
   total:h.length,correct:c,wrong:h.length-c,
   rate:h.length?Math.round(c/h.length*100):0,
   exams:state.exams.length,
   pending:Object.values(state.reviews).filter(x=>x.due<=now()).length
  };
 },
 bySubject(){
  const d={};
  for(const i of state.history){
   const k=i.disciplina||"Geral";
   if(!d[k]) d[k]={total:0,correct:0};
   d[k].total++;
   if(i.correct) d[k].correct++;
  }
  return d;
 },
 record(q,choice,mode){
  state.history.push({
   id:q.id,disciplina:q.disciplina,assunto:q.assunto,
   choice,correct:choice===q.correta,mode,date:now()
  });
  if(state.history.length>10000) state.history=state.history.slice(-10000);
  if(choice!==q.correta) ReviewManager.mark(q.id);
  save();
 }
};

const ReviewManager={
 mark(id){ state.reviews[id]={due:now(),interval:1,repetitions:0,ease:2.5}; save(); },
 remove(id){ delete state.reviews[id]; save(); },
 due(){ return questions.filter(q=>state.reviews[q.id]&&state.reviews[q.id].due<=now()); },
 all(){ return questions.filter(q=>state.reviews[q.id]); }
};

const SpacedRepetition={
 grade(id,quality){
  const o=state.reviews[id]||{interval:1,repetitions:0,ease:2.5};
  let r=o.repetitions,i=o.interval,e=o.ease;
  if(quality<3){ r=0; i=1; } else {
   r++;
   if(r===1) i=1; else if(r===2) i=6;
   else i=Math.max(1,Math.round(i*e));
  }
  e=Math.max(1.3,e+(.1-(5-quality)*(.08+(5-quality)*.02)));
  state.reviews[id]={repetitions:r,interval:i,ease:e,due:now()+i*86400000};
  save();
 }
};

function showExam(root){
 if(examTimerId){ clearInterval(examTimerId); examTimerId=null; }
 const pool=exam.ids.map(id=>QuestionManager.find(id)).filter(Boolean);
 if(!pool.length){
  paragraph("Questões indisponíveis.",root);
  button("Encerrar",()=>{ exam=null; state.activeExam=null; save(); render(); },root);
  return;
 }
 exam.index=Math.max(0,Math.min(exam.index,pool.length-1));
 const q=pool[exam.index];
 const timer=element("p","",root);
 function upd(){
  if(!exam||!timer.isConnected) return;
  if(!exam.duration){ timer.textContent="Sem limite."; return; }
  const r=Math.max(0,exam.duration-(now()-exam.start));
  const s=Math.ceil(r/1000);
  timer.textContent="Tempo: "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  if(r<=0) finishExam();
 }
 upd();
 if(exam.duration){
  examTimerId=setInterval(()=>{
   if(!timer.isConnected||!exam){ clearInterval(examTimerId); examTimerId=null; return; }
   upd();
  },1000);
 }
 renderQuestion(q,root,exam.index+1,pool.length,"exam",exam.answers);
 const c=element("div",null,root,"controls");
 button("◀ Anterior",()=>{ exam.index=Math.max(0,exam.index-1); state.activeExam=exam; save(); render(); },c);
 button("Próxima ▶",()=>{ exam.index=Math.min(pool.length-1,exam.index+1); state.activeExam=exam; save(); render(); },c);
 paragraph(`Respondidas: ${Object.keys(exam.answers).length}/${pool.length}`,root);
 button("Finalizar simulado",finishExam,root);
}

function finishExam(){
 if(!exam||finishingExam) return;
 finishingExam=true;
 try{
  if(examTimerId){ clearInterval(examTimerId); examTimerId=null; }
  const pool=exam.ids.map(id=>QuestionManager.find(id)).filter(Boolean);
  let correct=0,wrong=0,blank=0;
  for(const q of pool){
   const choice=exam.answers[q.id];
   if(choice===undefined){ blank++; continue; }
   if(choice===q.correta){ correct++; } else { wrong++; }
   StatisticsManager.record(q,choice,"Simulado");
  }
  state.exams.push({id:exam.id,date:now(),total:pool.length,correct,wrong,blank,duration:now()-exam.start});
  exam=null; state.activeExam=null; save();
  page="Desempenho"; render();
  status(`Simulado: ${correct} ✓ · ${wrong} ✗ · ${blank} em branco`);
 }finally{
  finishingExam=false;
 }
}

/* ── Helpers de texto com AUTO-FIT ── */

/**
 * Desenha texto em um canvas com auto-fit:
 * - Tenta fontSizeMax, reduz até caber em (maxW × maxH)
 * - Faz wrap por pixels medidos
 * - Trunca com "…" só se fontSize chegar ao mínimo
 */
function drawFittedText(ctx,text,maxW,maxH,opts){
 opts=opts||{};
 const fontSizeMax=opts.fontSizeMax||64;
 const fontSizeMin=opts.fontSizeMin||18;
 const lineHeightFactor=opts.lineHeightFactor||1.2;
 const bold=opts.bold!==false;
 const maxLines=opts.maxLines||10;

 let fs=fontSizeMax;
 let lines=[];
 let lh=0;

 while(fs>=fontSizeMin){
  ctx.font=`${bold?'bold ':''}${fs}px system-ui, Arial`;
  lines=[];
  let ln='';
  for(const wd of String(text).split(/\s+/)){
   const t=ln?ln+' '+wd:wd;
   if(ctx.measureText(t).width>maxW&&ln){ lines.push(ln); ln=wd; }
   else ln=t;
  }
  if(ln) lines.push(ln);
  lh=fs*lineHeightFactor;
  if(lines.length<=maxLines && lines.length*lh<=maxH) break;
  fs-=2;
 }

 if(lines.length>maxLines){
  lines=lines.slice(0,maxLines);
  let last=lines[maxLines-1];
  while(ctx.measureText(last+'…').width>maxW && last.length>0) last=last.slice(0,-1);
  lines[maxLines-1]=last+'…';
 } else if(lines.length*lh>maxH){
  const maxL=Math.max(1,Math.floor(maxH/lh));
  if(lines.length>maxL){
   lines=lines.slice(0,maxL);
   let last=lines[maxL-1];
   while(ctx.measureText(last+'…').width>maxW && last.length>0) last=last.slice(0,-1);
   lines[maxL-1]=last+'…';
  }
 }

 return {lines,lh,fs};
}

class VRPanel {
 constructor(width,height,position,rotationY=0){
  this.group=new THREE.Group();
  this.group.position.copy(position);
  this.group.rotation.y=rotationY;
  this.width=width; this.height=height;
  this.clickables=[];

  const cw=Math.round(width*PX_PER_M);
  const ch=Math.round(height*PX_PER_M);
  const cv=document.createElement('canvas');
  cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,ch);
  grad.addColorStop(0,'#0e2519'); grad.addColorStop(1,'#071711');
  ctx.fillStyle=grad; ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle='#54e5a0'; ctx.lineWidth=10; ctx.strokeRect(5,5,cw-10,ch-10);

  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;

  const bg=new THREE.Mesh(new THREE.PlaneGeometry(width,height),new THREE.MeshBasicMaterial({map:tex}));
  this.group.add(bg);
  this.bgTexture=tex;
 }

 addButton(x,y,w,h,text,onClick,opts={}){
  opts=opts||{};
  const cw=Math.round(w*PX_PER_M);
  const ch=Math.round(h*PX_PER_M);
  const cv=document.createElement('canvas');
  cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d');

  // Fundo + borda
  ctx.fillStyle=opts.bgColor||'#19362a'; ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle=opts.borderColor||'#54e5a0'; ctx.lineWidth=4; ctx.strokeRect(2,2,cw-4,ch-4);

  // Texto com auto-fit
  const padding=opts.padding||14;
  const maxW=cw-padding*2;
  const maxH=ch-padding*2;
  const align=opts.align||'center';

  const {lines,lh,fs}=drawFittedText(ctx,text,maxW,maxH,{
   fontSizeMax:opts.fontSizeMax||Math.min(ch*0.42,cw*0.09),
   fontSizeMin:opts.fontSizeMin||16,
   maxLines:opts.maxLines||2,
   bold:true,
   lineHeightFactor:1.15
  });

  ctx.fillStyle=opts.textColor||'#f1f8f3';
  ctx.font=`bold ${fs}px system-ui, Arial`;
  ctx.textBaseline='middle';
  if(align==='left') ctx.textAlign='left';
  else if(align==='right') ctx.textAlign='right';
  else ctx.textAlign='center';

  const totalH=lines.length*lh;
  const startY=ch/2-totalH/2+lh/2;
  const startX=align==='left'?padding:align==='right'?cw-padding:cw/2;

  lines.forEach((l,i)=>ctx.fillText(l,startX,startY+i*lh));

  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;

  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  mesh.position.set(x,y,0.01);
  mesh.userData.onClick=onClick;
  mesh.userData.isButton=true;
  this.group.add(mesh);
  this.clickables.push(mesh);

  // Glow
  const glow=new THREE.Mesh(
   new THREE.PlaneGeometry(w+0.03,h+0.03),
   new THREE.MeshBasicMaterial({color:0x54e5a0,transparent:true,opacity:0.55,side:THREE.DoubleSide})
  );
  glow.position.set(x,y,0.005);
  glow.visible=false;
  this.group.add(glow);
  mesh.userData.glow=glow;

  return mesh;
 }

 addText(x,y,w,h,text,opts={}){
  opts=opts||{};
  const cw=Math.round(w*PX_PER_M);
  const ch=Math.round(h*PX_PER_M);
  const cv=document.createElement('canvas');
  cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d');

  const padding=opts.padding||10;
  const maxW=cw-padding*2;
  const maxH=ch-padding*2;
  const align=opts.align||'left';

  const {lines,lh,fs}=drawFittedText(ctx,text,maxW,maxH,{
   fontSizeMax:opts.fontSizeMax||Math.min(ch*0.6,cw*0.12),
   fontSizeMin:opts.fontSizeMin||14,
   maxLines:opts.maxLines||8,
   bold:opts.bold!==false,
   lineHeightFactor:1.25
  });

  ctx.fillStyle=opts.color||'#f1f8f3';
  ctx.font=`${opts.bold!==false?'bold ':''}${fs}px system-ui, Arial`;
  ctx.textBaseline='top';
  if(align==='left') ctx.textAlign='left';
  else if(align==='right') ctx.textAlign='right';
  else ctx.textAlign='center';

  const totalH=lines.length*lh;
  let startY=padding;
  if(opts.valign==='middle') startY=ch/2-totalH/2;
  else if(opts.valign==='bottom') startY=ch-totalH-padding;

  const startX=align==='left'?padding:align==='right'?cw-padding:cw/2;

  lines.forEach((l,i)=>ctx.fillText(l,startX,startY+i*lh));

  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;

  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  mesh.position.set(x,y,0.01);
  this.group.add(mesh);
  return mesh;
 }

 dispose(){
  this.group.traverse(o=>{
   if(o.geometry) o.geometry.dispose();
   if(o.material){
    if(o.material.map) o.material.map.dispose();
    o.material.dispose();
   }
  });
 }
}

 showExam(){
  this.clear();
  if(!exam){ this.showExamMenu(); return; }
  const pool=exam.ids.map(id=>QuestionManager.find(id)).filter(Boolean);
  if(!pool.length){ this.showExamMenu(); return; }
  exam.index=Math.max(0,Math.min(exam.index,pool.length-1));
  const q=pool[exam.index];

  const p=this.createPanel(2.8,2.4);
  p.addText(0,1.02,2.5,0.12,`Questão ${exam.index+1} de ${pool.length}`,{align:'center',color:'#54e5a0',fontSizeMax:34,valign:'middle'});

  p.addText(0,0.65,2.5,0.55,q.enunciado,{align:'left',fontSizeMax:42,maxLines:4,valign:'top'});

  q.alternativas.forEach((alt,i)=>{
   const y=0.25-i*0.24;
   const text=`${String.fromCharCode(65+i)}) ${alt}`;
   const selected=exam.answers[q.id]===i;
   p.addButton(0,y,2.6,0.20,text,()=>{
    exam.answers[q.id]=i;
    state.activeExam=exam; save();
    this.showExam();
   },{
    bgColor:selected?'#174c32':'#19362a',
    borderColor:selected?'#6affaa':'#365b49',
    align:'left',fontSizeMax:28,maxLines:2
   });
  });

  p.addButton(-0.9,-1.05,0.6,0.16,'◀ Anterior',()=>{
   exam.index=Math.max(0,exam.index-1); state.activeExam=exam; save(); this.showExam();
  },{fontSizeMax:32});

  p.addButton(0,-1.05,0.6,0.16,'Finalizar',()=>{
   const choices=Object.keys(exam.answers).length;
   if(!confirm(`Finalizar? ${choices}/${pool.length} respondidas`)) return;
   let c=0,w=0,b=0;
   for(const qq of pool){
    const ch=exam.answers[qq.id];
    if(ch===undefined){ b++; continue; }
    if(ch===qq.correta){ c++; } else { w++; }
    StatisticsManager.record(qq,ch,'Simulado');
   }
   state.exams.push({id:exam.id,date:now(),total:pool.length,correct:c,wrong:w,blank:b,duration:now()-exam.start});
   exam=null; state.activeExam=null; save();
   this.showHome();
  },{fontSizeMax:32,bgColor:'#7a4a10',borderColor:'#ffaa00'});

  p.addButton(0.9,-1.05,0.6,0.16,'Próxima ▶',()=>{
   exam.index=Math.min(pool.length-1,exam.index+1); state.activeExam=exam; save(); this.showExam();
  },{fontSizeMax:32});
 },

 updateHover(controllers){
  if(!this.current) return;
  const t=performance.now();
  if(t-this.lastHoverTime<50) return;
  this.lastHoverTime=t;

  for(const ctrl of controllers){
   if(!ctrl) continue;
   ctrl.updateWorldMatrix(true,false);
   const m=new THREE.Matrix4().extractRotation(ctrl.matrixWorld);
   this.raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
   this.raycaster.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();
   this.raycaster.far=8;

   const hits=this.raycaster.intersectObjects(this.current.clickables,false);

   if(ctrl.userData.laser){
    const dist=hits.length>0?Math.min(hits[0].distance,8):8;
    ctrl.userData.laser.scale.z=dist;
   }

   this.current.clickables.forEach(b=>{
    if(b.userData.glow) b.userData.glow.visible=false;
   });

   if(hits.length>0){
    const target=hits[0].object;
    if(target.userData.glow) target.userData.glow.visible=true;
   }
  }
 },

 handleClick(controller){
  if(!this.current) return;
  controller.updateWorldMatrix(true,false);
  const m=new THREE.Matrix4().extractRotation(controller.matrixWorld);
  this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  this.raycaster.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();
  this.raycaster.far=8;

  const hits=this.raycaster.intersectObjects(this.current.clickables,false);
  if(hits.length>0){
   const btn=hits[0].object;
   if(btn.userData.onClick) btn.userData.onClick();
  }
 }
};

/* ── init3D ── */

function init3D(){
 try{
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x071711);
  camera=new THREE.PerspectiveCamera(70,1,.1,100);
  rig=new THREE.Group();
  rig.position.set(0,1.65,3);
  rig.add(camera);
  scene.add(rig);

  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
  renderer.xr.enabled=true;
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  $("scene").append(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x405344,2.0));
  const sun=new THREE.DirectionalLight(0xffffff,1.5);
  sun.position.set(5,10,5); scene.add(sun);

  changeEnvironment(state.environment);

  const vrBtn=VRButton.createButton(renderer);
  vrBtn.style.display="none";
  document.body.append(vrBtn);

  $("vr").onclick=async()=>{
   if(!navigator.xr){ status("WebXR não disponível."); return; }
   try{
    const ok=await navigator.xr.isSessionSupported("immersive-vr");
    if(!ok){ status("VR não suportada."); return; }
    vrBtn.click();
   }catch(e){ status("Erro VR: "+e.message); }
  };

  renderer.xr.addEventListener("sessionstart",()=>{
   status("🥽 VR iniciada — use os controles");
   rig.position.set(0,0,0);
   vrManager.showHome();
  });
  renderer.xr.addEventListener("sessionend",()=>{
   status("VR encerrada");
   vrManager.clear();
   rig.position.set(0,1.65,3);
   render();
  });

  const ctrls=[];
  for(let i=0;i<2;i++){
   const ctrl=renderer.xr.getController(i);
   ctrl.addEventListener("selectstart",()=>vrManager.handleClick(ctrl));
   rig.add(ctrl);
   ctrls.push(ctrl);

   const laserGeo=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-8)
   ]);
   const laser=new THREE.Line(laserGeo,new THREE.LineBasicMaterial({color:0x54e5a0}));
   ctrl.add(laser);
   ctrl.userData.laser=laser;
  }

  let lastW=0,lastH=0;
  renderer.setAnimationLoop(()=>{
   const c=$("scene");
   const w=c.clientWidth,h=c.clientHeight;
   if(w&&h&&(w!==lastW||h!==lastH)){
    lastW=w; lastH=h;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
   }
   if(renderer.xr.isPresenting) vrManager.updateHover(ctrls);
   renderer.render(scene,camera);
  });

  $("rotateLeft").onclick=()=>{ rig.rotation.y+=Math.PI/8; };
  $("rotateRight").onclick=()=>{ rig.rotation.y-=Math.PI/8; };
  $("resetView").onclick=()=>{ rig.rotation.y=0; rig.position.set(0,1.65,3); };
 }catch(e){ console.error(e); status("Falha WebGL: "+e.message); }
}

/* ── CONFIG / INIT ── */

function applySettings(){
 const wasFocus=document.body.classList.contains("focus");
 document.body.className="";
 if(state.theme!=="dark") document.body.classList.add(state.theme);
 if(wasFocus) document.body.classList.add("focus");
 document.documentElement.style.setProperty("--font",(state.fontSize||16)+"px");
 $("theme").value=state.theme;
 $("environment").value=state.environment;
 $("quality").value=state.quality;
}

function initializeMenus(){
 for(const n of pages) button(n,()=>navigate(n),$("menu"));
 environments.forEach((name,i)=>{
  const o=document.createElement("option"); o.value=i; o.textContent=name;
  $("environment").append(o);
 });
 $("environment").onchange=e=>changeEnvironment(Number(e.target.value));
 $("theme").onchange=e=>{ state.theme=e.target.value; save(); applySettings(); };
 $("quality").onchange=e=>{ state.quality=e.target.value; save(); };
 $("refresh").onclick=()=>ContentRepository.load();
}

(async function start(){
 try{
  initializeMenus();
  applySettings();
  init3D();
  navigate("Início");
  await ContentRepository.load();
 }catch(e){ console.error(e); status("Erro: "+e.message); }
})();
