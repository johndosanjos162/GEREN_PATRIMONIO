<style>
:root{
 --bg:#071711;
 --panel:#10251d;

html{scroll-behavior:smooth}

body{

button,input,select{

button,select,input{

select:focus-visible{

header{

header small{

}

.layout{

}

aside{

}

nav{

nav button{

main{

.grid{

.metric strong{

.controls{

.field label{

.question{

.option{

 margin:9px 0;

}

.option.correct{

.option.wrong{

.explanation{

 white-space:pre-wrap;

#scene{

 display:block;

#status{

progress{

 height:15px;

.badge{

 border:1px solid var(--border);
 padding:5px 9px;

 color:var(--muted);

.flashcard{

 place-items:center;
 text-align:center;
 padding:25px;

 border:1px solid var(--accent);

 cursor:pointer;

 line-height:1.7;

.bar{
 height:12px;

 border-radius:20px;

.bar span{

 height:100%;

}

.notice{

<script type="module">

import * as THREE from "three";
import {VRButton} from "three/addons/webxr/VRButton.js";

/* ==================================================
   1. CONFIGURAÇÃO PRINCIPAL
================================================== */

const APP={
 name:"PM-SC Immersive Academy 2026",
 repo:"johndosanjos162/PMSC",
 version:3,
 storageKey:"PMSC_ACADEMY_V3"
};

const $=id=>document.getElementById(id);

const environments=[
 "Pátio de Formatura",
 "Sala de Instrução Militar",
 "Entrada do Quartel",
 "Campo de Treinamento",
 "Alojamento Militar"
];

const pages=[
 "Início",
 "Estudos",
 "Simulados",
 "Flashcards",
 "Revisões",
 "Desempenho",
 "Banco de Questões",
 "Configurações"
];

const defaults={
 environment:0,
 theme:"dark",
 quality:"medium",
 history:[],
 favorites:[],
 reviews:{},
 exams:[],
 flashcards:{},
 session:null
};

let state;
let questions=[];
let page="Início";
let currentIndex=0;
let studyPool=[];
let exam=null;
let flashBack=false;
let loadBusy=false;

const now=()=>Date.now();

const uid=()=>Math.random().toString(36).slice(2);

const escapeHTML=s=>String(s??"").replace(
 /[&<>"']/g,
 c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c])
);

function status(message){
 $("status").textContent=message;
}

function save(){
 try{
  localStorage.setItem(
   APP.storageKey,
   JSON.stringify(state)
  );
 }catch(e){
  status("Não foi possível salvar os dados.");
 }
}

/* ==================================================
   2. STORAGE MANAGER
================================================== */

const StorageManager={
 load(){
  try{
   const data=JSON.parse(
    localStorage.getItem(APP.storageKey)||"{}"
   );

   return {
    ...structuredClone(defaults),
    ...data
   };
  }catch{
   return structuredClone(defaults);
  }
 },

 export(){
  download(
   "backup-pmsc.json",
   JSON.stringify(state,null,2),
   "application/json"
  );
 },

 async restore(file){
  if(!file||file.size>3000000){
   throw Error("Arquivo inválido ou muito grande.");
  }

  const data=JSON.parse(await file.text());

  if(
   !data||
   !Array.isArray(data.history)||
   !Array.isArray(data.favorites)||
   typeof data.reviews!=="object"
  ){
   throw Error("Estrutura de backup incompatível.");
  }

  state={
   ...structuredClone(defaults),
   ...data
  };

  save();
  applySettings();
  render();
 }
};

state=StorageManager.load();

/* ==================================================
   3. GERENCIADOR DE QUESTÕES
================================================== */

const QuestionManager={

 normalize(raw){

  if(!raw||typeof raw!=="object")return null;

  const statement=
   raw.enunciado??
   raw.pergunta??
   raw.question;

  let options=
   raw.alternativas??
   raw.opcoes??
   raw.options;

  if(
   options&&
   !Array.isArray(options)&&
   typeof options==="object"
  ){
   options=Object.values(options);
  }

  if(!Array.isArray(options))return null;

  options=options.map(x=>
   typeof x==="string"
    ?x
    :x?.texto??x?.text??""
  );

  let correct=
   raw.correta??
   raw.gabarito??
   raw.correct;

  if(typeof correct==="string"){
   const letter=correct.trim().toUpperCase();

   if(/^[A-Z]$/.test(letter)){
    correct=letter.charCodeAt(0)-65;
   }else{
    correct=Number(letter);
   }
  }

  if(
   typeof statement!=="string"||
   !statement.trim()||
   options.length<2||
   options.some(x=>!String(x).trim())||
   !Number.isInteger(correct)||
   correct<0||
   correct>=options.length
  ){
   return null;
  }

  const id=String(
   raw.id||
   raw.codigo||
   `${raw.disciplina||"Geral"}:${statement}`
  );

  return {
   id,
   disciplina:String(raw.disciplina||"Geral"),
   assunto:String(raw.assunto||"Geral"),
   dificuldade:String(raw.dificuldade||"media"),
   enunciado:statement,
   alternativas:options.map(String),
   correta:correct,
   explicacao:String(
    raw.explicacao??raw.comentario??""
   ),
   referencia:String(raw.referencia||""),
   banca:String(raw.banca||""),
   ano:raw.ano||""
  };
 },

 deduplicate(list){
  const ids=new Set();

  return list.filter(q=>{
   const key=q.id;

   if(ids.has(key))return false;

   ids.add(key);
   return true;
  });
 },

 find(id){
  return questions.find(q=>q.id===id);
 }
};

/* ==================================================
   4. REPOSITÓRIO DE CONTEÚDO
================================================== */

const ContentRepository={

 async load(){

  if(loadBusy)return;

  loadBusy=true;
  status("Consultando GitHub...");

  let files=[];
  let rejected=0;
  let loaded=[];

  try{

   const response=await fetch(
    `https://api.github.com/repos/${APP.repo}/contents/`,
    {
     headers:{
      Accept:"application/vnd.github+json"
     }
    }
   );

   if(!response.ok){
    throw Error("GitHub API: "+response.status);
   }

   const listing=await response.json();

   files=listing.filter(f=>
    f.type==="file"&&
    f.name.toLowerCase().endsWith(".json")
   );

  }catch(e){

   status("Tentando manifesto alternativo...");

   try{

    const response=await fetch("./manifest.json");

    if(response.ok){

     const manifest=await response.json();

     const names=Array.isArray(manifest)
      ?manifest
      :manifest.files||[];

     files=names
      .filter(name=>
       typeof name==="string"&&
       /^[\w.-]+\.json$/i.test(name)
      )
      .map(name=>({
       name,
       download_url:
        `https://raw.githubusercontent.com/${APP.repo}/HEAD/${name}`
      }));
    }

   }catch{}
  }

  for(const file of files){

   try{

    const response=await fetch(file.download_url);

    if(!response.ok)continue;

    const text=await response.text();

    if(text.length>5000000){
     rejected++;
     continue;
    }

    const json=JSON.parse(text);

    const items=Array.isArray(json)
     ?json
     :Array.isArray(json.questoes)
      ?json.questoes
      :Array.isArray(json.questions)
       ?json.questions
       :[];

    for(const item of items){

     const q=QuestionManager.normalize(item);

     if(q)loaded.push(q);
     else rejected++;
    }

   }catch{
    rejected++;
   }
  }

  loaded=QuestionManager.deduplicate(loaded);

  if(loaded.length){

   questions=loaded;

   try{
    localStorage.setItem(
     APP.storageKey+"_BANK",
     JSON.stringify(questions)
    );
   }catch{}

   status(
    `${files.length} arquivos | `+
    `${questions.length} questões | `+
    `${rejected} rejeitadas`
   );

  }else{

   try{
    questions=JSON.parse(
     localStorage.getItem(
      APP.storageKey+"_BANK"
     )||"[]"
    );
   }catch{
    questions=[];
   }

   status(
    questions.length
     ?"Banco salvo recuperado."
     :"Nenhuma questão compatível disponível."
   );
  }

  loadBusy=false;

  if(page==="Estudos"){
   studyPool=[];
  }

  render();
 }
};

/* ==================================================
   5. ESTATÍSTICAS
================================================== */

const StatisticsManager={

 summary(){

  const history=state.history;

  const correct=history.filter(x=>x.correct).length;

  return {
   total:history.length,
   correct,
   wrong:history.length-correct,
   rate:history.length
    ?Math.round(correct/history.length*100)
    :0,
   exams:state.exams.length,
   pending:Object.values(state.reviews)
    .filter(x=>x.due<=now()).length
  };
 },

 bySubject(){

  const data={};

  for(const item of state.history){

   const key=item.disciplina||"Geral";

   if(!data[key]){
    data[key]={total:0,correct:0};
   }

   data[key].total++;

   if(item.correct)data[key].correct++;
  }

  return data;
 },

 record(question,choice,mode){

  state.history.push({
   id:question.id,
   disciplina:question.disciplina,
   assunto:question.assunto,
   choice,
   correct:choice===question.correta,
   mode,
   date:now()
  });

  if(state.history.length>10000){
   state.history=state.history.slice(-10000);
  }

  if(choice!==question.correta){
   ReviewManager.mark(question.id);
  }

  save();
 }
};

/* ==================================================
   6. REVISÃO INTELIGENTE
================================================== */

const ReviewManager={

 mark(id){

  state.reviews[id]={
   due:now(),
   interval:1,
   repetitions:0,
   ease:2.5
  };

  save();
 },

 remove(id){
  delete state.reviews[id];
  save();
 },

 due(){

  return questions.filter(q=>
   state.reviews[q.id]&&
   state.reviews[q.id].due<=now()
  );
 },

 all(){

  return questions.filter(q=>state.reviews[q.id]);
 }
};

/* ==================================================
   7. REPETIÇÃO ESPAÇADA
================================================== */

const SpacedRepetition={

 grade(id,quality){

  const old=state.reviews[id]||{
   interval:1,
   repetitions:0,
   ease:2.5
  };

  let repetitions=old.repetitions;
  let interval=old.interval;
  let ease=old.ease;

  if(quality<3){

   repetitions=0;
   interval=1;

  }else{

   repetitions++;

   if(repetitions===1)interval=1;
   else if(repetitions===2)interval=6;
   else interval=Math.max(
    1,
    Math.round(interval*ease)
   );
  }

  ease=Math.max(
   1.3,
   ease+(
    .1-(5-quality)*(.08+(5-quality)*.02)
   )
  );

  state.reviews[id]={
   repetitions,
   interval,
   ease,
   due:now()+interval*86400000
  };

  save();
 }
};

/* ==================================================
   8. INTERFACE
================================================== */

function element(tag,text,parent,className){

 const node=document.createElement(tag);

 if(text!==undefined&&text!==null){
  node.textContent=String(text);
 }

 if(className)node.className=className;

 if(parent)parent.append(node);

 return node;
}

function button(text,callback,parent){

 const node=element("button",text,parent);

 node.addEventListener("click",callback);

 return node;
}

function clearContent(title){

 const root=$("content");

 root.replaceChildren();

 element("h2",title,root);

 return root;
}

function paragraph(text,parent){

 return element("p",text,parent);
}

function sectionTitle(text,parent){

 return element("h3",text,parent);
}

function field(label,type,value,parent){

 const wrap=element("div",null,parent,"field");

 element("label",label,wrap);

 const input=element("input",null,wrap);

 input.type=type;
 input.value=value;

 return input;
}

function selectField(label,values,parent){

 const wrap=element("div",null,parent,"field");

 element("label",label,wrap);

 const select=element("select",null,wrap);

 for(const value of values){

  const option=document.createElement("option");

  option.value=value;
  option.textContent=value;

  select.append(option);
 }

 return select;
}

function metric(label,value,parent){

 const card=element("div",null,parent,"metric");

 element("strong",value,card);
 element("span",label,card);
}

function renderSidebar(){

 const s=StatisticsManager.summary();

 $("sidebarMetrics").replaceChildren();

 const box=$("sidebarMetrics");

 sectionTitle("Seu desempenho",box);

 paragraph(`Questões: ${s.total}`,box);
 paragraph(`Acertos: ${s.correct}`,box);
 paragraph(`Erros: ${s.wrong}`,box);
 paragraph(`Aproveitamento: ${s.rate}%`,box);
 paragraph(`Revisões pendentes: ${s.pending}`,box);
}

function navigate(destination){

 page=destination;

 document.querySelectorAll("#menu button")
  .forEach(b=>{
   b.classList.toggle(
    "active",
    b.textContent===destination
   );
  });

 render();
}

function render(){

 renderSidebar();

 switch(page){

  case "Início":
   renderHome();
   break;

  case "Estudos":
   renderStudies();
   break;

  case "Simulados":
   renderExams();
   break;

  case "Flashcards":
   renderFlashcards();
   break;

  case "Revisões":
   renderReviews();
   break;

  case "Desempenho":
   renderStatistics();
   break;

  case "Banco de Questões":
   renderBank();
   break;

  case "Configurações":
   renderSettings();
   break;
 }
}

/* ==================================================
   9. CENTRAL INTELIGENTE
================================================== */

function renderHome(){

 const root=clearContent("Central Inteligente de Estudos");

 const s=StatisticsManager.summary();

 const grid=element("div",null,root,"grid");

 metric("Questões respondidas",s.total,grid);
 metric("Aproveitamento",s.rate+"%",grid);
 metric("Simulados",s.exams,grid);
 metric("Revisões pendentes",s.pending,grid);

 sectionTitle("Próxima atividade recomendada",root);

 const subjects=StatisticsManager.bySubject();

 const ranking=Object.entries(subjects)
  .filter(([,v])=>v.total>0)
  .sort((a,b)=>
   a[1].correct/a[1].total-
   b[1].correct/b[1].total
  );

 if(ranking.length){

  paragraph(
   "Disciplina para reforçar: "+ranking[0][0],
   root
  );

 }else{

  paragraph(
   "Comece respondendo questões para gerar recomendações.",
   root
  );
 }

 paragraph(
  `Banco disponível: ${questions.length} questões.`,
  root
 );

 const actions=element("div",null,root,"controls");

 button(
  "Iniciar estudos",
  ()=>navigate("Estudos"),
  actions
 );

 button(
  "Revisar erros",
  ()=>navigate("Revisões"),
  actions
 );

 button(
  "Criar simulado",
  ()=>navigate("Simulados"),
  actions
 );

 if(state.session?.id){

  button(
   "Continuar última questão",
   ()=>{
    studyPool=questions.filter(q=>
     q.id===state.session.id
    );

    currentIndex=0;

    navigate("Estudos");
   },
   actions
  );
 }
}

/* ==================================================
   10. ESTUDO DE QUESTÕES
================================================== */

function getFilteredQuestions(subject,topic,difficulty,search){

 const term=(search||"").toLowerCase();

 return questions.filter(q=>

  (!subject||q.disciplina===subject)&&
  (!topic||q.assunto===topic)&&
  (!difficulty||q.dificuldade===difficulty)&&

  (!term||
   [
    q.id,
    q.enunciado,
    q.assunto,
    q.disciplina,
    q.referencia
   ].join(" ").toLowerCase().includes(term)
  )
 );
}

function renderStudies(){

 const root=clearContent("Estudo de Questões");

 const subjects=[
  "",
  ...new Set(questions.map(q=>q.disciplina))
 ];

 const topics=[
  "",
  ...new Set(questions.map(q=>q.assunto))

function renderQuestion(q,parent,number,total,mode,answers){

 const meta=element("div",null,parent);

 element(
  "span",
  q.disciplina,
  meta,
  "badge"
 );

 element(
  "span",
  q.assunto,
  meta,
  "badge"
 );

 element(
  "span",
  q.dificuldade,
  meta,
  "badge"
 );

 paragraph(
  `Questão ${number} de ${total}`,
  parent
 );

 const progress=element("progress",null,parent);

 progress.max=total;
 progress.value=number;

 element(
  "div",
  q.enunciado,
  parent,
  "question"
 );

 const options=element("div",null,parent);

 const existing=mode==="exam"
  ?answers[q.id]
  :undefined;

 let answered=false;

 q.alternativas.forEach((text,i)=>{

  const option=button(
   `${String.fromCharCode(65+i)}. ${text}`,
   ()=>{

    if(mode==="exam"){

     answers[q.id]=i;

     state.activeExam=exam;

     save();

     options.querySelectorAll("button")
      .forEach((b,j)=>{
       b.classList.toggle(
        "selected",
        j===i
       );
      });

     return;
    }

    if(answered)return;

    answered=true;

    StatisticsManager.record(q,i,mode);

    options.querySelectorAll("button")
     .forEach((b,j)=>{

      b.disabled=true;

      if(j===q.correta){
       b.classList.add("correct");
      }

      if(j===i&&i!==q.correta){
       b.classList.add("wrong");
      }
     });

    const explanation=element(
     "div",
     null,
     parent,
     "explanation"
    );

    paragraph(
     i===q.correta
      ?"Resposta correta!"
      :"Resposta incorreta.",
     explanation
    );

    paragraph(
     "Gabarito: "+
     String.fromCharCode(65+q.correta),
     explanation
    );

    paragraph(
     q.explicacao||
     "Explicação não disponível no banco.",
     explanation
    );

    if(q.referencia){
     paragraph(
      "Referência: "+q.referencia,
      explanation
     );
    }

    renderSidebar();

   },
   options
  );

  option.classList.add("option");

  if(existing===i){
   option.classList.add("selected");
  }
 });
}

function renderExams(){

 const root=clearContent("Simulados");

 if(exam){
  showExam(root);
  return;
 }

 const count=field(
  "Quantidade de questões",
  "number",
  20,
  root
 );

 count.min=1;

 const minutes=field(
  "Tempo em minutos (0 = livre)",
  "number",
  60,
  root
 );

 minutes.min=0;

 const subjects=[
  "",
  ...new Set(questions.map(q=>q.disciplina))
 ];

 const subject=selectField(
  "Disciplina",
  subjects,
  root
 );

 button("Iniciar simulado",()=>{

  const pool=questions.filter(q=>
   !subject.value||
   q.disciplina===subject.value
  );

  if(!pool.length){
   status("Nenhuma questão disponível.");
   return;
  }

  const shuffled=[...pool];

  for(let i=shuffled.length-1;i>0;i--){

   const j=Math.floor(Math.random()*(i+1));

   [shuffled[i],shuffled[j]]=
   [shuffled[j],shuffled[i]];
  }

  const amount=Math.min(
   shuffled.length,
   Math.max(1,Number(count.value)||20)
  );

  exam={
   id:uid(),
   ids:shuffled.slice(0,amount).map(q=>q.id),
   answers:{},
   index:0,
   start:now(),
   duration:Math.max(
    0,
    Number(minutes.value)||0
   )*60000
  };

  state.activeExam=exam;
  save();

  render();

 },root);

 if(state.activeExam){

  button("Retomar simulado salvo",()=>{

   exam=state.activeExam;
   render();

  },root);
 }
}

function showExam(root){

 const pool=exam.ids
  .map(id=>QuestionManager.find(id))
  .filter(Boolean);

 if(!pool.length){

  paragraph(
   "As questões deste simulado não estão disponíveis.",
   root
  );

  button("Encerrar",()=>{
   exam=null;
   state.activeExam=null;
   save();
   render();
  },root);

  return;
 }

 exam.index=Math.max(
  0,
  Math.min(exam.index,pool.length-1)
 );

 const q=pool[exam.index];

 const timer=element("p","",root);

 function updateTimer(){

  if(!exam||!timer.isConnected)return;

  if(!exam.duration){

   timer.textContent="Simulado sem limite de tempo.";
   return;
  }

  const remaining=Math.max(
   0,
   exam.duration-(now()-exam.start)
  );

  const seconds=Math.ceil(remaining/1000);

  timer.textContent=
   "Tempo restante: "+
   Math.floor(seconds/60)+":"+
   String(seconds%60).padStart(2,"0");

  if(remaining<=0){
   finishExam();
  }
 }

 updateTimer();

 const timerId=setInterval(()=>{

  if(!timer.isConnected||!exam){
   clearInterval(timerId);
   return;
  }

  updateTimer();

 },1000);

 renderQuestion(
  q,
  root,
  exam.index+1,
  pool.length,
  "exam",
  exam.answers
 );

 const controls=element(
  "div",null,root,"controls"
 );

 button("◀ Anterior",()=>{

  exam.index=Math.max(0,exam.index-1);
  state.activeExam=exam;
  save();
  render();

 },controls);

 button("Próxima ▶",()=>{

  exam.index=Math.min(
   pool.length-1,
   exam.index+1
  );

  state.activeExam=exam;
  save();
  render();

 },controls);

 paragraph(
  `Respondidas: ${
   Object.keys(exam.answers).length
  }/${pool.length}`,
  root
 );

 button("Finalizar simulado",finishExam,root);
}

function finishExam(){

 if(!exam)return;

 const pool=exam.ids
  .map(id=>QuestionManager.find(id))
  .filter(Boolean);

 let correct=0;
 let wrong=0;
 let blank=0;

 const bySubject={};

 for(const q of pool){

  const choice=exam.answers[q.id];

  if(!bySubject[q.disciplina]){
   bySubject[q.disciplina]={
    total:0,
    correct:0
   };
  }

  bySubject[q.disciplina].total++;

  if(choice===undefined){

   blank++;
   continue;
  }

  if(choice===q.correta){

   correct++;
   bySubject[q.disciplina].correct++;

  }else{

   wrong++;
  }

  StatisticsManager.record(
   q,
   choice,
   "Simulado"
  );
 }

 const result={
  id:exam.id,
  date:now(),
  total:pool.length,
  correct,
  wrong,
  blank,
  duration:now()-exam.start,
  bySubject
 };

 state.exams.push(result);

 exam=null;
 state.activeExam=null;

 save();

 page="Desempenho";

 render();

 status(
  `Simulado finalizado: ${correct} acertos, `+
  `${wrong} erros e ${blank} em branco.`
 );
}

================================================== */

function csv(value){

 return '"'+String(value??"")
  .replace(/"/g,'""')+'"';
}

function download(name,content,type){

 const blob=new Blob(
  [content],
  {type}
 );

 const url=URL.createObjectURL(blob);

 const link=document.createElement("a");

 link.href=url;
 link.download=name;

 document.body.append(link);

 link.click();
 link.remove();

 setTimeout(()=>{
  URL.revokeObjectURL(url);
 },1000);
}

   18. MOTOR TRIDIMENSIONAL
================================================== */

let scene;
let camera;
let renderer;
let rig;
let room;

const materials=new Map();

function material(color){

 if(!materials.has(color)){

  materials.set(
   color,
   new THREE.MeshStandardMaterial({
    color,
    roughness:.8
   })
  );
 }

 return materials.get(color);
}

function cube(x,y,z,w,h,d,color){

 const geometry=new THREE.BoxGeometry(w,h,d);

 const mesh=new THREE.Mesh(
  geometry,
  material(color)
 );

 mesh.position.set(x,y,z);

 room.add(mesh);

 return mesh;
}

function cylinder(x,y,z,r,h,color){

 const geometry=new THREE.CylinderGeometry(
  r,r,h,12
 );

 const mesh=new THREE.Mesh(
  geometry,
  material(color)
 );

 mesh.position.set(x,y,z);

 room.add(mesh);

 return mesh;
}

function brazilFlag(x,z){

 // Representação geométrica simplificada
 // da bandeira brasileira.

 cylinder(
  x,2,z,
  .045,4,
  "#cccccc"
 );

 cube(
  x+.7,3.25,z,
  1.4,.9,.04,
  "#169b45"
 );

 const diamond=cube(
  x+.7,3.25,z+.04,
  .75,.6,.025,
  "#ffdf00"
 );

 diamond.rotation.z=Math.PI/4;

 const sphere=new THREE.Mesh(
  new THREE.SphereGeometry(.25,16,12),
  material("#002776")
 );

 sphere.scale.z=.12;

 sphere.position.set(
  x+.7,3.25,z+.09
 );

 room.add(sphere);
}

function tree(x,z){

 cylinder(
  x,.9,z,
  .14,1.8,
  "#725333"
 );

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(1.1,3,8),
  material("#315e36")
 );

 crown.position.set(x,3,z);

 room.add(crown);
}

function bed(x,z){

 cube(x,.45,z,1.6,.18,2.2,"#667e77");
 cube(x,1.45,z,1.6,.18,2.2,"#667e77");

 for(const dx of [-.7,.7]){
  for(const dz of [-1,1]){

   cube(
    x+dx,1,z+dz,
    .09,2,.09,
    "#a3aaa7"
   );
  }
 }
}

function disposeRoom(){

 if(!room)return;

 scene.remove(room);

 room.traverse(object=>{

  if(object.geometry){
   object.geometry.dispose();
  }

  // Os materiais são compartilhados
  // e permanecem reutilizáveis.
 });

 room=null;
}

function changeEnvironment(index){

 save();

 disposeRoom();

 room=new THREE.Group();

  index===3?"#8bb9d3":"#7e9da9"
 );

 cube(

 );

 if(index!==3){

  cube(
   0,3,-11,
   26,6,.35,

  );
 }

 if(index===0){

  // Pátio de formatura.

  cube(
   0,2,-10.5,
   10,4,.5,
   "#586d61"
  );

  for(let x=-4;x<=4;x+=2){

   cube(
    x,.015,-2,
    .1,.03,6,
    "#e2dfca"
   );
  }

  brazilFlag(-7,-9);
  brazilFlag(7,-9);

  for(let x=-9;x<=9;x+=3){

   cylinder(
    x,.7,-7,
    .2,1.4,

   );

 }

 if(index===1){

  // Sala de instrução.

  cube(
   0,2.5,-10.7,
   7,2.5,.08,
   "#1e4c37"
  );

  for(let x=-4;x<=4;x+=2){

   for(let z=-5;z<=2;z+=2){

    cube(
     x,.75,z,
     1.4,.15,.8,
     "#765a3e"
    );

    cube(
     x,.38,z,
     .1,.7,.1,
     "#596b65"
    );
   }
  }

  brazilFlag(-8,-9);
 }

 if(index===2){

  // Entrada do quartel.

  cube(
   -5,1.6,-7,
   3,3.2,3,
   "#c4b9a4"
  );

  cube(
   -5,3.35,-7,
   3.7,.3,3.7,
   "#596a5e"
  );

  for(let x=-2;x<=7;x+=.8){

   cube(
    x,1.4,-8,
    .09,2.8,.09,
    "#43574e"
   );
  }

  brazilFlag(8,-7);
 }

 if(index===3){

  // Campo de treinamento.

  for(let x=-8;x<=8;x+=4){

   cube(
    x,.55,-5,
    2,1.1,1,
    "#9a8057"
   );

   tree(x+1.8,-9);
  }

  for(let z=-2;z<=5;z+=2){

   cube(
    -5,.15,z,
    3,.3,.18,
    "#92734d"
   );
  }

  brazilFlag(7,-8);
 }

 if(index===4){

  // Alojamento militar.

  for(let x=-6;x<=6;x+=3){

   bed(x,-5);
   bed(x,1);
  }

  cube(
   0,2.5,-10.7,
   4,1.5,.1,
   "#345849"
  );

  brazilFlag(8,-9);
 }

 renderer.render(scene,camera);
}

  ()=>status("Sessão VR iniciada.")
 );

 renderer.xr.addEventListener(
  "sessionend",
  ()=>status("Sessão VR encerrada.")
 );

 renderer.setAnimationLoop(()=>{

  const container=$("scene");

  const width=container.clientWidth;
  const height=container.clientHeight;

  if(width&&height){

   const canvas=renderer.domElement;

   const pixelRatio=renderer.getPixelRatio();

   const targetWidth=Math.floor(
    width*pixelRatio
   );

   const targetHeight=Math.floor(
    height*pixelRatio
   );

   if(
    canvas.width!==targetWidth||
    canvas.height!==targetHeight
   ){

    renderer.setSize(width,height,false);

    camera.aspect=width/height;

    camera.updateProjectionMatrix();
   }
  }

  renderer.render(scene,camera);
 });

 $("rotateLeft").onclick=()=>{
  rig.rotation.y+=Math.PI/8;
 };

 $("rotateRight").onclick=()=>{
  rig.rotation.y-=Math.PI/8;
 };

 $("resetView").onclick=()=>{
  rig.rotation.y=0;
  rig.position.set(0,1.65,7);
 };
}

/* ==================================================
   21. CONFIG MANAGER
================================================== */

function applySettings(){

 document.body.className="";

 if(state.theme!=="dark"){
  document.body.classList.add(state.theme);
 }

 $("theme").value=state.theme;
 $("environment").value=state.environment;
 $("quality").value=state.quality;
}

function initializeMenus(){

 for(const name of pages){

  button(
   name,
   ()=>navigate(name),
   $("menu")
  );
 }

 environments.forEach((name,i)=>{

  const option=document.createElement("option");

  option.value=i;
  option.textContent=name;

  $("environment").append(option);
 });

 $("environment").onchange=e=>{

  changeEnvironment(Number(e.target.value));

 };

 $("theme").onchange=e=>{

  state.theme=e.target.value;

  save();
  applySettings();
 };

 $("quality").onchange=e=>{

  state.quality=e.target.value;

  save();

  status(
   "Qualidade salva. Recarregue a página para aplicar."
  );
 };

 $("refresh").onclick=()=>{
  ContentRepository.load();
 };
}

/* ==================================================
   22. APP CORE
================================================== */

const AppCore={

 async start(){

  try{

   initializeMenus();

   applySettings();

   init3D();

   navigate("Início");

   await ContentRepository.load();

  }catch(error){

   console.error(error);

   status(
    "Falha na inicialização: "+error.message
   );
  }
 }
};

AppCore.start();

</script>
