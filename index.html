<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>Patrimônio 360 | Gestão patrimonial</title>
<style>
:root{color-scheme:dark;--bg:#080f1d;--panel:#101c2c;--panel2:#16263a;--line:#293a50;--text:#eef5ff;--muted:#9bacc3;--blue:#5fa8ff;--green:#45d4aa;--red:#ff7788;--yellow:#ffcb78;--shadow:0 18px 48px #0003;--radius:17px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#1a3450,transparent 40%),var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bbfff;outline-offset:2px}a{color:inherit}h1,h2,h3,p{margin-top:0}h1{font-size:28px;letter-spacing:-.8px;margin:0}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:15px}small,.muted{color:var(--muted)}.shell{display:flex;min-height:100vh}.sidebar{width:252px;flex:none;background:#0d1726;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:23px 14px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:12px;align-items:center;padding:4px 9px 23px;border-bottom:1px solid var(--line);font-size:19px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;font-size:10px;letter-spacing:1.8px;font-weight:600}.brand-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,#2374cf,#52b6cf);font-size:22px}.nav{padding-top:20px;display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid transparent;background:transparent;border-radius:10px;color:#a7b8ce;text-align:left;font-weight:600}.nav button:hover{background:#18283b;color:var(--text)}.nav button.active{background:#1a3553;border-color:#315574;color:#dbecff}.nav .ico{font-size:17px;width:21px;text-align:center}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:17px 10px;color:var(--muted);font-size:12px}.main{width:calc(100% - 252px);max-width:1700px;padding:28px clamp(16px,3vw,46px) 70px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top-actions{display:flex;align-items:center;gap:9px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{background:var(--green);width:7px;height:7px;border-radius:50%}.btn{padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:650}.btn:hover{border-color:#6486ae}.btn.primary{background:#367fdf;border-color:#367fdf;color:white}.btn.danger{border-color:#773946;color:#ffc7d0}.btn.sm{padding:6px 10px;font-size:12px}.mobile-menu{display:none}.hero{padding:29px 30px;background:linear-gradient(110deg,#1b3b5c,#152b42 53%,#111d2e);border:1px solid #35516d;border-radius:20px;margin-bottom:22px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero small{font-size:11px;color:#8acdfa;text-transform:uppercase;letter-spacing:2px;font-weight:700}.hero h2{font-size:26px;margin:4px 0}.hero p{color:#b3c5da;margin-bottom:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 0 14px;flex-wrap:wrap}.section-head h2{margin:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:linear-gradient(150deg,#152338,#101b2b);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.kpi{min-height:130px}.kpi .label{color:#a7b8cf;font-size:12px}.kpi .num{font-size:clamp(19px,2vw,27px);font-weight:800;letter-spacing:-.7px;margin:12px 0 6px;overflow-wrap:anywhere}.kpi .tip{font-size:12px;color:var(--muted)}.green{color:var(--green)!important}.red{color:var(--red)!important}.yellow{color:var(--yellow)!important}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:17px}.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:17px}.chart-wrap{height:260px;position:relative}.chart-wrap canvas{width:100%;height:100%;display:block}.empty{padding:30px 10px;text-align:center;color:var(--muted);border:1px dashed #344760;border-radius:13px}.table-scroll{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;min-width:650px;text-align:left}th,td{border-bottom:1px solid #2c3c50;padding:13px 10px;vertical-align:middle}th{text-transform:uppercase;letter-spacing:1px;font-size:10px;color:#9dafc5}tr:last-child td{border:0}td{color:#e4edfa}td .sub{font-size:11px;color:var(--muted);display:block}.right{text-align:right}.chip{display:inline-flex;padding:4px 9px;border:1px solid #37506b;background:#1d354e;border-radius:50px;font-size:11px;color:#d1e7ff}.chip.ok{color:#92f6ce;border-color:#287655;background:#143c32}.chip.bad{color:#ffb6bf;border-color:#83414b;background:#472631}.actions{white-space:nowrap;display:flex;gap:5px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{min-width:160px}input,select{width:100%;background:#0b1827;border:1px solid #36506a;border-radius:10px;color:var(--text);padding:10px 11px;min-height:41px}input[type=date]{color-scheme:dark}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:5px;color:#bacbe0;font-size:12px;font-weight:600}.field.wide{grid-column:1/-1}.modal-wrap{position:fixed;inset:0;background:#020812c9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal{background:#132137;border:1px solid #3d5772;border-radius:17px;padding:24px;max-width:590px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 90px #000a}.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-top h2{margin:0}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.notice{background:#182e41;border:1px solid #31516e;border-radius:11px;padding:13px 16px;color:#bed4ed}.progress{height:9px;border-radius:50px;background:#283b50;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#428aff,#4fd7bc);border-radius:50px}.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.goal-grid h3{margin-bottom:8px}.mini-stat{padding:13px;border-radius:12px;background:#15283a;display:flex;justify-content:space-between;gap:10px;margin-top:9px}.switcher{display:flex;gap:9px;flex-wrap:wrap}.footnote{color:var(--muted);font-size:12px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;background:#234d49;border:1px solid #369b86;padding:12px 18px;border-radius:11px;z-index:70;box-shadow:var(--shadow)}.hidden{display:none!important}@media(max-width:1140px){.kpis{grid-template-columns:repeat(2,1fr)}.goal-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.sidebar{transform:translateX(-100%);position:fixed;transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{width:100%;padding:15px 15px 55px}.mobile-menu{display:inline-flex}.grid2,.grid-half{grid-template-columns:1fr}.hero{padding:20px}.hero h2{font-size:22px}}@media(max-width:570px){.kpis,.goal-grid,.form-grid{grid-template-columns:1fr}.top-actions .status{display:none}.hero{display:block}.hero .btn{margin-top:14px}.topbar h1{font-size:21px}.card{padding:15px}.toolbar input,.toolbar select{min-width:0}.section-head{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon">◈</span><span>PATRIMÔNIO 360<small>WEB EDITION</small></span></div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><div>● Armazenamento local</div><div>Seus dados ficam neste navegador.</div><div style="margin-top:8px">Versão 1.0 · Gestão pessoal</div></div></aside><main class="main"><header class="topbar"><div class="toolbar"><button class="btn mobile-menu" id="menuToggle" aria-label="Abrir menu">☰</button><div><h1 id="pageTitle">Visão geral</h1><small id="pageSub">Acompanhe seu patrimônio em um só lugar</small></div></div><div class="top-actions"><span class="status"><span class="dot"></span>Dados locais</span><button class="btn" id="quickBackup">↓ Backup</button></div></header><div id="view"></div></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='patrimonio360.web.v1';
const MODELS={ativos:{title:'Meu patrimônio',sub:'Seus bens e valores patrimoniais',sing:'Bem',icon:'⌂',fields:[['nome','Nome do bem','text',true],['categoria','Categoria','select',true,['Imóvel','Veículo','Conta bancária','Reserva','Bem pessoal','Negócio','Outros']],['valor','Valor atual (R$)','number',true]]},investimentos:{title:'Investimentos',sub:'Carteira e valorização das aplicações',sing:'Investimento',icon:'◉',fields:[['ativo','Nome do investimento','text',true],['classe','Classe','select',true,['Renda fixa','Ações','Fundos imobiliários','ETFs','Tesouro Direto','Previdência','Outros']],['valor_investido','Total investido (R$)','number',true],['valor_atual','Valor atual (R$)','number',true],['data_aporte','Data do aporte','date',true]]},passivos:{title:'Dívidas',sub:'Compromissos financeiros e amortização',sing:'Dívida',icon:'▣',fields:[['nome','Nome da dívida','text',true],['tipo','Tipo','select',true,['Empréstimo','Financiamento','Cartão','Pessoal','Outros']],['valor_total','Saldo devedor (R$)','number',true],['parcelas_restantes','Parcelas restantes','integer',true],['juros_mensal','Juros mensais (%)','number',true]]},receitas:{title:'Receitas',sub:'Todas as entradas registradas',sing:'Receita',icon:'↗',fields:[['descricao','Descrição','text',true],['valor','Valor (R$)','number',true],['mes','Mês','month',true],['ano','Ano','year',true],['tipo','Tipo','select',true,['Salário','Aluguel','Extra','Dividendos','Outros']]]},despesas:{title:'Despesas',sub:'Controle de gastos variáveis',sing:'Despesa',icon:'↘',fields:[['descricao','Descrição','text',true],['categoria','Categoria','select',true,['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Assinaturas','Impostos','Outros']],['valor','Valor (R$)','number',true],['data','Data','date',true]]},fixos:{title:'Gastos fixos',sub:'Compromissos recorrentes mensais',sing:'Gasto fixo',icon:'▤',fields:[['descricao','Descrição','text',true],['valor','Valor mensal (R$)','number',true]]},contas:{title:'Contas a pagar',sub:'Vencimentos e pagamentos',sing:'Conta',icon:'◷',fields:[['descricao','Descrição','text',true],['categoria','Categoria','select',true,['Moradia','Alimentação','Transporte','Saúde','Educação','Impostos','Outros']],['valor','Valor (R$)','number',true],['vencimento','Vencimento','date',true],['pago','Situação','bool',true]]},metas:{title:'Metas financeiras',sub:'Planejamento para objetivos importantes',sing:'Meta',icon:'◎',fields:[['nome','Nome da meta','text',true],['categoria','Categoria','select',true,['Reserva','Investimento','Imóvel','Veículo','Viagem','Outros']],['valor_alvo','Valor desejado (R$)','number',true],['valor_atual','Valor acumulado (R$)','number',true],['prazo_anos','Prazo em anos','integer',true]]}};
const NAV=[['dashboard','▦','Visão geral'],['ativos','⌂','Meu patrimônio'],['investimentos','◉','Investimentos'],['movimentacoes','⇄','Fluxo de caixa'],['passivos','▣','Dívidas'],['contas','◷','Contas a pagar'],['metas','◎','Metas financeiras'],['simulador','◈','Simulador'],['relatorios','▤','Relatórios']];
const ids=Object.keys(MODELS),empty=()=>Object.fromEntries(ids.map(k=>[k,[]]));let db=load(),page='dashboard',filters={},sim={inicial:10000,mensal:500,taxa:10,anos:10};
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(!v||typeof v!=='object')return empty();return Object.fromEntries(ids.map(k=>[k,Array.isArray(v[k])?v[k]:[]]));}catch{return empty()}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Não foi possível gravar no navegador. Libere espaço ou faça um backup.');return false}}
const $=id=>document.getElementById(id),brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0),num=n=>Number(n)||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=(arr,key)=>arr.reduce((a,x)=>a+num(x[key]),0),today=()=>new Date().toISOString().slice(0,10),now=()=>new Date(),ym=(d)=>{let dt=new Date(d.getFullYear(),d.getMonth(),1);return [dt.getFullYear(),dt.getMonth()+1]},safeDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))?s:'';
function notify(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
const kpi=(label,value,tip='',tone='')=>`<div class="card kpi"><div class="label">${esc(label)}</div><div class="num ${tone}">${esc(value)}</div><div class="tip">${esc(tip)}</div></div>`;
function totals(){const assets=sum(db.ativos,'valor'),invest=sum(db.investimentos,'valor_atual'),debts=sum(db.passivos,'valor_total'),[y,m]=ym(now()),income=db.receitas.filter(x=>+x.mes===m&&+x.ano===y).reduce((a,x)=>a+num(x.valor),0),out=db.despesas.filter(x=>String(x.data).startsWith(`${y}-${String(m).padStart(2,'0')}`)).reduce((a,x)=>a+num(x.valor),0)+sum(db.fixos,'valor');return{assets,invest,debts,worth:assets+invest-debts,income,out,balance:income-out}}
function navigate(target){page=NAV.some(x=>x[0]===target)?target:'dashboard';filters={};$('sidebar').classList.remove('open');location.hash=page;render()}
function render(){let info=NAV.find(x=>x[0]===page)||NAV[0];$('pageTitle').textContent=info[2];$('pageSub').textContent=page==='dashboard'?'Acompanhe seu patrimônio em um só lugar':MODELS[page]?.sub||'Análises e gerenciamento';$('nav').innerHTML=NAV.map(x=>`<button data-go="${x[0]}" class="${page===x[0]?'active':''}" ${page===x[0]?'aria-current="page"':''}><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');$('view').innerHTML=page==='dashboard'?dashboard():page==='movimentacoes'?cashflow():page==='simulador'?simulator():page==='relatorios'?reports():page==='metas'?goals():page==='contas'?accounts():MODELS[page]?listing(page):dashboard();drawCharts()}
const sections=(title,action='')=>`<div class="section-head"><h2>${title}</h2>${action}</div>`,addBtn=k=>`<button class="btn primary" data-add="${k}">+ Adicionar ${MODELS[k].sing.toLowerCase()}</button>`;
function dashboard(){let t=totals();let pending=db.contas.filter(x=>!x.pago).sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento))).slice(0,5);let categoryMap={};db.ativos.forEach(x=>categoryMap[x.categoria]=(categoryMap[x.categoria]||0)+num(x.valor));db.investimentos.forEach(x=>categoryMap[x.classe]=(categoryMap[x.classe]||0)+num(x.valor_atual));return `<div class="hero"><div><small>CONTROLE FINANCEIRO INTEGRADO</small><h2>Seu patrimônio, com clareza.</h2><p>Centralize seus bens, aplicações, obrigações e objetivos.</p></div><button class="btn primary" data-add="ativos">+ Registrar patrimônio</button></div><div class="kpis">${kpi('Patrimônio líquido',brl(t.worth),'Bens + investimentos − dívidas',t.worth<0?'red':'green')}${kpi('Bens cadastrados',brl(t.assets),`${db.ativos.length} registros`)}${kpi('Investimentos',brl(t.invest),`${db.investimentos.length} aplicações`)}${kpi('Dívidas',brl(t.debts),`${db.passivos.length} obrigações`,'red')}</div>${sections('Análises financeiras')}<div class="grid2"><div class="card"><h3>Fluxo de caixa · últimos 12 meses</h3><div class="chart-wrap"><canvas id="cashChart" aria-label="Gráfico de receitas e despesas"></canvas></div></div><div class="card"><h3>Composição do patrimônio</h3><div class="chart-wrap"><canvas id="allocationChart" aria-label="Gráfico de alocação de bens e investimentos"></canvas></div></div></div>${sections('Resumo e próximos compromissos')}<div class="grid-half"><div class="card"><h3>Resultado do mês</h3><div class="mini-stat"><span>Receitas</span><strong class="green">${brl(t.income)}</strong></div><div class="mini-stat"><span>Despesas + fixos</span><strong class="red">${brl(t.out)}</strong></div><div class="mini-stat"><span>Saldo estimado</span><strong class="${t.balance>=0?'green':'red'}">${brl(t.balance)}</strong></div><p class="footnote">O saldo é estimado a partir dos lançamentos cadastrados, não representa saldo bancário.</p></div><div class="card"><h3>Próximas contas pendentes</h3>${pending.length?pending.map(x=>`<div class="mini-stat"><span>${esc(x.descricao)}<small style="display:block">${esc(x.vencimento)}</small></span><strong>${brl(x.valor)}</strong></div>`).join(''):'<div class="empty">Nenhuma conta pendente.</div>'}<div style="margin-top:12px"><button class="btn sm" data-go="contas">Gerenciar contas</button></div></div></div>`}
function listing(k){const model=MODELS[k],all=db[k],q=(filters.q||'').toLowerCase(),records=all.filter(x=>Object.values(x).some(v=>String(v??'').toLowerCase().includes(q)));let cols=model.fields.filter(f=>f[0]!=='pago');return sections(`${model.title} <small>(${all.length})</small>`,addBtn(k))+`<div class="card"><div class="toolbar" style="margin-bottom:16px"><input id="searchList" placeholder="Pesquisar registros..." value="${esc(filters.q||'')}" aria-label="Pesquisar registros" style="max-width:310px"><span class="muted">${records.length} registros encontrados</span></div>${records.length?`<div class="table-scroll"><table><thead><tr>${cols.map(f=>`<th>${esc(f[1].replace(' (R$)',''))}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${records.map(x=>`<tr>${cols.map(f=>`<td>${formatField(f,x[f[0]])}</td>`).join('')}<td><div class="actions"><button class="btn sm" data-edit="${k}" data-id="${esc(x.id)}">Editar</button><button class="btn sm danger" data-delete="${k}" data-id="${esc(x.id)}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum registro encontrado. Use Adicionar para começar.</div>'}</div>`}
function formatField(field,val){let key=field[0],type=field[2];if(type==='number'&&key!=='juros_mensal')return esc(brl(val));if(key==='juros_mensal')return esc(`${num(val).toFixed(2)}%`);if(type==='date')return esc(safeDate(val)?safeDate(val).split('-').reverse().join('/'):'—');return esc(val)}
function accounts(){let pending=db.contas.filter(x=>!x.pago),paid=db.contas.filter(x=>x.pago),q=(filters.q||'').toLowerCase(),items=db.contas.filter(x=>[x.descricao,x.categoria,x.vencimento].some(v=>String(v).toLowerCase().includes(q)));return `<div class="kpis">${kpi('Total pendente',brl(sum(pending,'valor')),`${pending.length} contas`,'yellow')}${kpi('Total pago',brl(sum(paid,'valor')),`${paid.length} contas`,'green')}${kpi('Contas atrasadas',String(pending.filter(x=>safeDate(x.vencimento)<today()).length),'Não pagas e vencidas','red')}${kpi('Contas cadastradas',String(db.contas.length),'Histórico completo')}</div>`+sections('Lista de contas',addBtn('contas'))+`<div class="card"><div class="toolbar" style="margin-bottom:15px"><input id="searchList" placeholder="Buscar conta" value="${esc(filters.q||'')}"></div>${items.length?`<div class="table-scroll"><table><thead><tr><th>Conta</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.descricao)}</td><td>${esc(x.categoria)}</td><td>${esc(x.vencimento)}</td><td>${brl(x.valor)}</td><td><span class="chip ${x.pago?'ok':safeDate(x.vencimento)<today()?'bad':''}">${x.pago?'Paga':'Pendente'}</span></td><td><div class="actions"><button class="btn sm" data-toggle="contas" data-id="${esc(x.id)}">${x.pago?'Reabrir':'Marcar paga'}</button><button class="btn sm" data-edit="contas" data-id="${esc(x.id)}">Editar</button><button class="btn sm danger" data-delete="contas" data-id="${esc(x.id)}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma conta cadastrada.</div>'}</div>`}
function goals(){return sections('Seus objetivos',addBtn('metas'))+`<div class="goal-grid">${db.metas.length?db.metas.map(x=>{let p=num(x.valor_alvo)>0?Math.min(100,Math.max(0,num(x.valor_atual)/num(x.valor_alvo)*100)):0;return `<div class="card"><span class="chip">${esc(x.categoria)}</span><h3 style="margin-top:15px">${esc(x.nome)}</h3><div style="font-size:22px;font-weight:800">${brl(x.valor_atual)}</div><div class="muted" style="margin:5px 0 15px">de ${brl(x.valor_alvo)} · ${p.toFixed(1)}%</div><div class="progress"><span style="width:${p}%"></span></div><div class="mini-stat"><span>Restante</span><strong>${brl(Math.max(0,num(x.valor_alvo)-num(x.valor_atual)))}</strong></div><div class="mini-stat"><span>Prazo</span><strong>${esc(x.prazo_anos)} ano(s)</strong></div><div class="toolbar" style="margin-top:14px"><button class="btn sm" data-edit="metas" data-id="${esc(x.id)}">Atualizar</button><button class="btn sm danger" data-delete="metas" data-id="${esc(x.id)}">Excluir</button></div></div>`}).join(''):'<div class="empty">Cadastre uma meta e acompanhe sua evolução.</div>'}</div>`}
function cashflow(){let t=totals();return `<div class="kpis">${kpi('Receitas do mês',brl(t.income),'Lançamentos do mês','green')}${kpi('Despesas variáveis',brl(t.out-sum(db.fixos,'valor')),'Lançamentos do mês','red')}${kpi('Gastos fixos mensais',brl(sum(db.fixos,'valor')),'Recorrentes')}${kpi('Saldo estimado',brl(t.balance),'Receitas − despesas e fixos',t.balance>=0?'green':'red')}</div>`+sections('Evolução mensal')+`<div class="card"><div class="chart-wrap"><canvas id="cashChart"></canvas></div></div>`+sections('Gerenciar lançamentos')+`<div class="switcher"><button class="btn ${filters.cash==='receitas'?'primary':''}" data-cash="receitas">Receitas</button><button class="btn ${filters.cash==='despesas'?'primary':''}" data-cash="despesas">Despesas variáveis</button><button class="btn ${filters.cash==='fixos'?'primary':''}" data-cash="fixos">Gastos fixos</button></div><div style="height:14px"></div>`+listing(filters.cash||'despesas')}
function simulator(){return `<div class="hero"><div><small>PLANEJAMENTO DE LONGO PRAZO</small><h2>Simule a evolução do seu capital</h2><p>Estimativa matemática de juros compostos com aportes no fim de cada mês.</p></div></div><div class="grid2"><div class="card"><h2>Parâmetros da simulação</h2><form id="simForm" class="form-grid"><label class="field">Capital inicial (R$)<input type="number" name="inicial" min="0" step="0.01" required value="${sim.inicial}"></label><label class="field">Aporte mensal (R$)<input type="number" name="mensal" min="0" step="0.01" required value="${sim.mensal}"></label><label class="field">Taxa anual estimada (%)<input type="number" name="taxa" min="0" max="100" step="0.1" required value="${sim.taxa}"></label><label class="field">Prazo (anos)<input type="number" name="anos" min="1" max="60" step="1" required value="${sim.anos}"></label><div class="field wide"><button class="btn primary" type="submit">Recalcular projeção</button></div></form><p class="footnote">Projeção nominal hipotética: não inclui impostos, taxas, inflação nem rentabilidade variável. Não é garantia de retorno.</p></div><div class="card"><h2>Resultados estimados</h2><div id="simResults"></div></div></div>${sections('Evolução do capital')}<div class="card"><div class="chart-wrap"><canvas id="simChart"></canvas></div></div>`}
function project(){let s=sim,mRate=Math.pow(1+num(s.taxa)/100,1/12)-1,acc=num(s.inicial),paid=acc,rows=[{year:0,total:acc,paid}];for(let m=1;m<=s.anos*12;m++){acc=acc*(1+mRate)+num(s.mensal);paid+=num(s.mensal);if(m%12===0)rows.push({year:m/12,total:acc,paid})}return{rows,total:acc,paid,interest:acc-paid}}
function reports(){return `<div class="hero"><div><small>DADOS E AUDITORIA</small><h2>Seus registros, sob seu controle.</h2><p>Exporte e importe suas informações em arquivos. Faça cópias periodicamente.</p></div></div><div class="grid-half"><div class="card"><h2>Backup completo</h2><p class="muted">Salve todos os registros em JSON ou restaure uma cópia anterior. Importar substitui os dados atuais.</p><div class="toolbar"><button class="btn primary" data-export="json">↓ Exportar JSON</button><button class="btn" id="importTrigger">↑ Importar JSON</button><input class="hidden" type="file" accept="application/json,.json" id="importFile"></div></div><div class="card"><h2>Exportar planilhas</h2><p class="muted">Escolha uma seção para exportar seus dados no formato CSV, compatível com Excel e Google Sheets.</p><div class="toolbar"><select id="csvType">${ids.map(k=>`<option value="${k}">${esc(MODELS[k].title)}</option>`).join('')}</select><button class="btn primary" data-export="csv">↓ Exportar CSV</button></div></div></div>${sections('Inventário de registros')}<div class="card"><div class="table-scroll"><table><thead><tr><th>Categoria</th><th>Registros</th><th>Status</th></tr></thead><tbody>${ids.map(k=>`<tr><td>${esc(MODELS[k].title)}</td><td>${db[k].length}</td><td><span class="chip ok">Local</span></td></tr>`).join('')}</tbody></table></div></div><p class="footnote">Privacidade: os registros são armazenados no localStorage deste navegador. A versão atual não sincroniza entre dispositivos, não possui login e não deve ser usada em computador compartilhado. Limpar os dados do navegador pode apagá-los.</p>`}
function fieldHtml(f,val){let[key,label,type,required,opts]=f,v=val??(type==='date'?today():type==='month'?ym(now())[1]:type==='year'?ym(now())[0]:type==='bool'?false:'');let common=`name="${key}" id="f_${key}" ${required?'required':''}`;if(type==='select')return `<select ${common}>${opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(type==='bool')return `<select ${common}><option value="false" ${!v?'selected':''}>Pendente</option><option value="true" ${v?'selected':''}>Paga</option></select>`;let inp=type==='number'||type==='integer'||type==='month'||type==='year'?'number':type==='date'?'date':'text';let attrs=type==='number'?'min="0" step="0.01"':type==='integer'?'min="0" step="1"':type==='month'?'min="1" max="12" step="1"':type==='year'?'min="1900" max="2200" step="1"':'';return `<input ${common} type="${inp}" ${attrs} value="${esc(v)}">`}
function openModal(k,id){let x=id?db[k].find(v=>String(v.id)===String(id)):null,model=MODELS[k];$('modalRoot').innerHTML=`<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><h2 id="modalTitle">${x?'Editar':'Adicionar'} ${esc(model.sing.toLowerCase())}</h2><button class="btn sm" type="button" data-close aria-label="Fechar">✕</button></div><form id="itemForm" data-kind="${k}" data-id="${esc(id||'')}"><div class="form-grid">${model.fields.map(f=>`<label class="field ${f[2]==='text'?'wide':''}" for="f_${f[0]}">${esc(f[1])}${fieldHtml(f,x?.[f[0]])}</label>`).join('')}</div><div class="form-actions"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" type="submit">Salvar registro</button></div></form></div></div>`;$('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});$('itemForm').querySelector('input,select')?.focus()}
function closeModal(){$('modalRoot').innerHTML=''}
function saveItem(form){let k=form.dataset.kind,id=form.dataset.id,model=MODELS[k];let obj={};for(let f of model.fields){let[key,,type]=f,v=form.elements.namedItem(key).value;if(type==='number'||type==='integer'||type==='month'||type==='year'){v=Number(v);if(!Number.isFinite(v)||v<0||type==='integer'&&!Number.isInteger(v)||type==='month'&&(v<1||v>12)||type==='year'&&(v<1900||v>2200)){alert('Informe um valor válido para '+f[1]);return}}if(type==='bool')v=v==='true';if(type==='text'){v=v.trim();if(!v){alert('Preencha '+f[1]);return}}if(type==='date'&&!safeDate(v)){alert('Data inválida');return}obj[key]=v}if(id){let i=db[k].findIndex(x=>String(x.id)===String(id));if(i<0)return;db[k][i]={...db[k][i],...obj}}else db[k].push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`, ...obj});if(persist()){closeModal();render();notify('Registro salvo com sucesso')}}
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(k){let fields=MODELS[k].fields.map(f=>f[0]),rows=[fields,...db[k].map(x=>fields.map(p=>x[p]??''))];return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')}
function importData(file){if(!file||file.size>10*1024*1024){alert('Escolha um JSON com até 10 MB.');return}const reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data||typeof data!=='object'||!ids.every(k=>Array.isArray(data[k])))throw Error('Estrutura de backup inválida');for(let k of ids){if(data[k].length>100000||!data[k].every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!==undefined))throw Error(`Registros inválidos: ${k}`)}if(!confirm('A importação substituirá TODOS os dados locais atuais. Continuar?'))return;let old=db;db=Object.fromEntries(ids.map(k=>[k,data[k].map(x=>Object.fromEntries(Object.entries(x).filter(([a])=>a==='id'||MODELS[k].fields.some(f=>f[0]===a))))]));if(!persist()){db=old;return}render();notify('Dados restaurados')}catch(e){alert('Não foi possível importar: '+e.message)}};reader.readAsText(file)}
function chartData(){let dates=[];let d=now();for(let a=11;a>=0;a--){let y=d.getFullYear(),m=d.getMonth()-a;let dt=new Date(y,m,1);dates.push([dt.getFullYear(),dt.getMonth()+1])}return dates.map(([y,m])=>{let inc=db.receitas.filter(x=>+x.ano===y&&+x.mes===m).reduce((a,x)=>a+num(x.valor),0),expenses=db.despesas.filter(x=>String(x.data).startsWith(`${y}-${String(m).padStart(2,'0')}`)).reduce((a,x)=>a+num(x.valor),0)+sum(db.fixos,'valor');return{label:`${String(m).padStart(2,'0')}/${String(y).slice(-2)}`,inc,expenses}})}
function chartCanvas(id,draw){let canvas=$(id);if(!canvas)return;let rect=canvas.getBoundingClientRect(),w=Math.max(260,rect.width),h=Math.max(190,rect.height),dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);draw(c,w,h)}
function gridChart(c,w,h,max,labels,series){const l=62,r=16,t=18,b=37,W=w-l-r,H=h-t-b;c.font='11px system-ui';c.textBaseline='middle';for(let i=0;i<=4;i++){let y=t+i*H/4;c.strokeStyle='#293a50';c.beginPath();c.moveTo(l,y);c.lineTo(w-r,y);c.stroke();c.textAlign='right';c.fillStyle='#a0b1c6';c.fillText(new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1}).format((4-i)*max/4),l-9,y)}c.textAlign='center';labels.forEach((a,i)=>{let x=l+i*W/Math.max(1,labels.length-1);if(labels.length<=14||i%2===0)c.fillText(a,x,h-17)});series.forEach((s,si)=>{c.beginPath();s.values.forEach((v,i)=>{let x=l+i*W/Math.max(1,labels.length-1),y=t+H*(1-num(v)/max);i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle=s.color;c.lineWidth=2.7;c.stroke();s.values.forEach((v,i)=>{let x=l+i*W/Math.max(1,labels.length-1),y=t+H*(1-num(v)/max);c.beginPath();c.arc(x,y,2.2,0,Math.PI*2);c.fillStyle=s.color;c.fill()})})}
function drawCharts(){if($('cashChart'))chartCanvas('cashChart',(c,w,h)=>{let rows=chartData(),max=Math.max(1,...rows.flatMap(x=>[x.inc,x.expenses]))*1.15;gridChart(c,w,h,max,rows.map(x=>x.label),[{color:'#49d4ab',values:rows.map(x=>x.inc)},{color:'#ff8396',values:rows.map(x=>x.expenses)}]);c.font='11px system-ui';c.fillStyle='#49d4ab';c.fillText('● Receitas',77,11);c.fillStyle='#ff8396';c.fillText('● Despesas',172,11)});if($('allocationChart'))chartCanvas('allocationChart',(c,w,h)=>{let categories={};db.ativos.forEach(x=>categories[x.categoria]=(categories[x.categoria]||0)+num(x.valor));db.investimentos.forEach(x=>categories[x.classe]=(categories[x.classe]||0)+num(x.valor_atual));let data=Object.entries(categories).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),total=data.reduce((a,x)=>a+x[1],0),cx=w*.30,cy=h*.5,rad=Math.min(h*.31,w*.25),colors=['#5fa8ff','#45d4aa','#ffc778','#af95ff','#ff8c86','#5ad0db'];if(!total){c.fillStyle='#9bacc3';c.textAlign='center';c.font='13px system-ui';c.fillText('Cadastre bens ou investimentos',w/2,h/2);return}let start=-Math.PI/2;data.forEach((x,i)=>{let angle=x[1]/total*Math.PI*2;c.beginPath();c.arc(cx,cy,rad,start,start+angle);c.arc(cx,cy,rad*.58,start+angle,start,true);c.closePath();c.fillStyle=colors[i%colors.length];c.fill();start+=angle});c.fillStyle='#eff6ff';c.textAlign='center';c.font='bold 12px system-ui';c.fillText('Total',cx,cy-9);c.font='bold 14px system-ui';c.fillText(new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1}).format(total),cx,cy+11);c.textAlign='left';c.font='11px system-ui';data.slice(0,6).forEach((x,i)=>{let yy=35+i*33;c.fillStyle=colors[i%colors.length];c.fillRect(w*.57,yy,8,8);c.fillStyle='#c1d3e8';let name=x[0].length>14?x[0].slice(0,13)+'…':x[0];c.fillText(name,w*.57+15,yy+7);c.fillText((x[1]/total*100).toFixed(1)+'%',w*.57+15,yy+21)})});if($('simChart')){let r=project(),max=Math.max(1,r.total)*1.1;chartCanvas('simChart',(c,w,h)=>gridChart(c,w,h,max,r.rows.map(x=>String(x.year)),[{color:'#54aeff',values:r.rows.map(x=>x.total)},{color:'#4cdbb3',values:r.rows.map(x=>x.paid)}]));$('simResults').innerHTML=`<div class="mini-stat"><span>Montante projetado</span><strong class="green">${brl(r.total)}</strong></div><div class="mini-stat"><span>Total aplicado</span><strong>${brl(r.paid)}</strong></div><div class="mini-stat"><span>Juros projetados</span><strong class="green">${brl(r.interest)}</strong></div>`}}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)navigate(b.dataset.go)});$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');$('quickBackup').onclick=()=>download(JSON.stringify(db,null,2),'patrimonio360-backup-'+today()+'.json','application/json');window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p!==page&&NAV.some(x=>x[0]===p)){page=p;render()}});window.addEventListener('resize',()=>{clearTimeout(window.__chartResize);window.__chartResize=setTimeout(drawCharts,120)});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))return closeModal();if(b.dataset.go)return navigate(b.dataset.go);if(b.dataset.add)return openModal(b.dataset.add);if(b.dataset.edit)return openModal(b.dataset.edit,b.dataset.id);if(b.dataset.delete){let k=b.dataset.delete,id=b.dataset.id;if(confirm('Excluir este registro? Esta ação não pode ser desfeita.')){db[k]=db[k].filter(x=>String(x.id)!==String(id));persist();render();notify('Registro excluído')}return}if(b.dataset.toggle){let x=db.contas.find(x=>String(x.id)===String(b.dataset.id));if(x){x.pago=!x.pago;persist();render()}return}if(b.dataset.cash){filters.cash=b.dataset.cash;filters.q='';render();return}if(b.dataset.export==='json')return download(JSON.stringify(db,null,2),'patrimonio360-'+today()+'.json','application/json');if(b.dataset.export==='csv'){let k=$('csvType').value;return download(csv(k),`patrimonio360-${k}-${today()}.csv`,'text/csv;charset=utf-8')}if(b.id==='importTrigger')$('importFile').click()});document.addEventListener('input',e=>{if(e.target.id==='searchList'){let pos=e.target.selectionStart;filters.q=e.target.value;let newView=page==='movimentacoes'?cashflow():page==='contas'?accounts():listing(page);$('view').innerHTML=newView;let a=$('searchList');a.focus();a.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});document.addEventListener('submit',e=>{if(e.target.id==='itemForm'){e.preventDefault();saveItem(e.target)}if(e.target.id==='simForm'){e.preventDefault();let f=new FormData(e.target);sim={inicial:Number(f.get('inicial')),mensal:Number(f.get('mensal')),taxa:Number(f.get('taxa')),anos:Number(f.get('anos'))};if(Object.values(sim).some(v=>!Number.isFinite(v)||v<0)||sim.anos<1||sim.anos>60){alert('Parâmetros inválidos');return}render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});let initial=location.hash.slice(1);page=NAV.some(x=>x[0]===initial)?initial:'dashboard';render();
})();
</script></body></html>
