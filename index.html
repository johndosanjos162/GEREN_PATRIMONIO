<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PM-SC Immersive Academy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #081425;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10;
  background: rgba(8,20,37,.95);
  padding: 16px;
  border: 1px solid #4ba8ff;
  border-radius: 12px;
  width: min(350px, 95vw);
  max-height: 80vh;
  overflow: auto;
}

h2 {
  color: #65c5ff;
  margin-top: 0;
}

button {
  background: #1769d4;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px;
  margin: 5px;
  cursor: pointer;
}

button:hover {
  background: #3488ef;
}

input {
  max-width: 100%;
  margin: 8px 0;
}

#status {
  color: #b8dbff;
  font-size: 14px;
}

#vrButton {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 20;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="hud">

<h2>PM-SC Immersive Academy</h2>

<p id="status">Preparando ambiente virtual...</p>

<h3>Banco de questões</h3>

<input
  type="file"
  id="jsonFile"
  accept=".json,application/json"
>

<br>

<button id="demoButton">
Testar questões
</button>

<h3>Desempenho</h3>

<p id="stats"></p>

<p>
Use o gatilho dos controles ou o gesto de pinça
com as mãos para selecionar alternativas na sala.
</p>

</div>

<button id="vrButton">
Entrar em realidade virtual
</button>

<script type="module">

import * as THREE from "three";

import {
  XRControllerModelFactory
} from "three/addons/webxr/XRControllerModelFactory.js";

import {
  XRHandModelFactory
} from "three/addons/webxr/XRHandModelFactory.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x081425);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.05,
  100
);

camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x263653,
    2.5
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(2, 5, 3);

scene.add(light);

// CRIAÇÃO DA SALA

function createBox(
  width,
  height,
  depth,
  color,
  x,
  y,
  z
) {

  const geometry = new THREE.BoxGeometry(
    width,
    height,
    depth
  );

  const material = new THREE.MeshStandardMaterial({
    color: color
  });

  const mesh = new THREE.Mesh(
    geometry,
    material
  );

  mesh.position.set(x, y, z);

  scene.add(mesh);

  return mesh;
}

// PISO

createBox(
  12, 0.1, 12,
  0x16263c,
  0, -0.07, -2
);

// PAREDE CENTRAL

createBox(
  12, 4, 0.12,
  0x162c49,
  0, 2, -6
);

// PAREDES LATERAIS

createBox(
  0.12, 4, 12,
  0x142943,
  -6, 2, -2
);

createBox(
  0.12, 4, 12,
  0x142943,
  6, 2, -2
);

// PAINEL CENTRAL

createBox(
  4.8, 3.1, 0.08,
  0x12365c,
  0, 1.8, -3.6
);

// PAINÉIS LATERAIS

createBox(
  2, 2, 0.08,
  0x1a415c,
  -3.4, 1.8, -4
);

createBox(
  2, 2, 0.08,
  0x1a415c,
  3.4, 1.8, -4
);

// SISTEMA DE INTERAÇÃO

const interactiveObjects = [];

const dynamicObjects = [];

const raycaster = new THREE.Raycaster();

const rotationMatrix = new THREE.Matrix4();

// CRIAÇÃO DE TEXTO E BOTÕES 3D

function createLabel(
  text,
  x,
  y,
  z,
  width = 3,
  height = 0.3,
  action = null
) {

  const canvas = document.createElement("canvas");

  canvas.width = 1024;
  canvas.height = 192;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = action
    ? "#215d91"
    : "#12365c";

  ctx.fillRect(
    0, 0,
    canvas.width,
    canvas.height
  );

  ctx.strokeStyle = "#55c5ff";
  ctx.lineWidth = 5;

  ctx.strokeRect(
    3, 3,
    1018, 186
  );

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let fontSize = 46;

  ctx.font = `bold ${fontSize}px Arial`;

  while (
    ctx.measureText(text).width > 960 &&
    fontSize > 16
  ) {

    fontSize -= 2;

    ctx.font = `bold ${fontSize}px Arial`;
  }

  ctx.fillText(
    text,
    512,
    96
  );

  const texture = new THREE.CanvasTexture(
    canvas
  );

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide
  });

  const geometry = new THREE.PlaneGeometry(
    width,
    height
  );

  const mesh = new THREE.Mesh(
    geometry,
    material
  );

  mesh.position.set(x, y, z);

  scene.add(mesh);

  if (action) {

    mesh.userData.action = action;

    interactiveObjects.push(mesh);
  }

  dynamicObjects.push(mesh);

  return mesh;
}

// LIMPEZA DOS PAINÉIS

function clearPanel() {

  for (const mesh of dynamicObjects) {

    scene.remove(mesh);

    const index = interactiveObjects.indexOf(mesh);

    if (index >= 0) {
      interactiveObjects.splice(index, 1);
    }

    mesh.material.map.dispose();
    mesh.material.dispose();
    mesh.geometry.dispose();
  }

  dynamicObjects.length = 0;
}

// QUESTÕES

let questions = [];

let questionIndex = 0;

let answered = false;

let correctAnswers = 0;

let totalAnswers = 0;

// RECUPERA PROGRESSO LOCAL

try {

  const saved = JSON.parse(
    localStorage.getItem("pmsc_vr_progress") || "{}"
  );

  correctAnswers = saved.correct || 0;

  totalAnswers = saved.total || 0;

} catch (error) {

  correctAnswers = 0;
  totalAnswers = 0;
}

// ESTATÍSTICAS

function updateStats() {

  const percentage = totalAnswers
    ? (correctAnswers / totalAnswers * 100).toFixed(1)
    : 0;

  document.getElementById("stats").innerHTML =
    `Respondidas: ${totalAnswers}<br>
     Acertos: ${correctAnswers}<br>
     Aproveitamento: ${percentage}%`;
}

// SALVAR

function saveProgress() {

  localStorage.setItem(
    "pmsc_vr_progress",
    JSON.stringify({
      correct: correctAnswers,
      total: totalAnswers
    })
  );

  updateStats();
}

// ADICIONAR ELEMENTOS AO PAINEL

function addPanelText(
  text,
  x,
  y,
  width,
  height,
  action = null
) {

  return createLabel(
    text,
    x,
    y,
    -3.51,
    width,
    height,
    action
  );
}

// MOSTRAR QUESTÃO

function showQuestion(message = "") {

  clearPanel();

  addPanelText(
    "PM-SC IMMERSIVE ACADEMY",
    0, 3.04, 3.8, 0.28
  );

  if (!questions.length) {

    addPanelText(
      "Importe JSON ou use a demonstracao",
      0, 2.4, 3.8, 0.3
    );

    return;
  }

  const question = questions[questionIndex];

  const words = question.question.split(/\s+/);

  const lines = [];

  let line = "";

  for (const word of words) {

    const candidate = line
      ? line + " " + word
      : word;

    if (candidate.length > 49 && line) {

      lines.push(line);

      line = word;

    } else {

      line = candidate;
    }
  }

  if (line) {
    lines.push(line);
  }

  lines.slice(0, 3).forEach((text, index) => {

    addPanelText(
      text,
      0,
      2.75 - index * 0.22,
      3.8,
      0.2
    );

  });

  // ALTERNATIVAS

  question.options.slice(0, 5).forEach(
    (option, index) => {

      const letter = "ABCDE"[index];

      addPanelText(
        `${letter}) ${String(option).slice(0, 55)}`,
        0,
        1.88 - index * 0.32,
        3.8,
        0.26,
        () => answerQuestion(index)
      );

    }
  );

  addPanelText(
    message ||
    `Questao ${questionIndex + 1} de ${questions.length}`,
    0,
    0.32,
    3.8,
    0.24
  );

  addPanelText(
    "PROXIMA QUESTAO",
    0,
    0.03,
    2.5,
    0.24,
    nextQuestion
  );
}

// RESPONDER

function answerQuestion(selected) {

  if (answered) {
    return;
  }

  answered = true;

  const question = questions[questionIndex];

  const isCorrect = selected === question.correct;

  totalAnswers++;

  if (isCorrect) {
    correctAnswers++;
  }

  saveProgress();

  const message = isCorrect
    ? "RESPOSTA CORRETA!"
    : `GABARITO: ${"ABCDE"[question.correct]}`;

  showQuestion(message);
}

// PRÓXIMA QUESTÃO

function nextQuestion() {

  if (!questions.length) {
    return;
  }

  questionIndex =
    (questionIndex + 1) % questions.length;

  answered = false;

  showQuestion();
}

// NORMALIZAR JSON

function normalizeQuestion(q) {

  const question =
    q.enunciado ||
    q.pergunta ||
    q.questao ||
    q.question;

  const raw =
    q.alternativas ||
    q.opcoes ||
    q.options;

  if (!question || !raw) {
    return null;
  }

  const keys = Array.isArray(raw)
    ? null
    : Object.keys(raw);

  const options = Array.isArray(raw)
    ? raw
    : Object.values(raw);

  if (
    !Array.isArray(options) ||
    options.length < 2 ||
    options.length > 5
  ) {
    return null;
  }

  const answer =
    q.correta ??
    q.resposta ??
    q.gabarito ??
    q.correct;

  let correct = -1;

  if (typeof answer === "number") {

    correct = answer;

  } else if (typeof answer === "string") {

    const value = answer.trim();

    if (/^[A-E]$/i.test(value)) {

      correct =
        value.toUpperCase().charCodeAt(0) - 65;

    } else if (keys && keys.includes(value)) {

      correct = keys.indexOf(value);

    } else if (/^\d+$/.test(value)) {

      correct = Number(value);

    } else {

      correct = options.indexOf(value);
    }
  }

  if (
    !Number.isInteger(correct) ||
    correct < 0 ||
    correct >= options.length
  ) {
    return null;
  }

  return {
    question: String(question),
    options: options.map(String),
    correct: correct
  };
}

// QUESTÕES DE DEMONSTRAÇÃO

document.getElementById("demoButton").onclick = () => {

  questions = [

    {
      question:
        "Qual Constituicao esta atualmente vigente no Brasil?",

      options: [
        "Constituicao de 1967",
        "Constituicao de 1988",
        "Constituicao de 1946"
      ],

      correct: 1
    },

    {
      question:
        "Qual principio exige atuacao administrativa conforme a lei?",

      options: [
        "Legalidade",
        "Publicidade",
        "Eficiencia"
      ],

      correct: 0
    }

  ];

  questionIndex = 0;

  answered = false;

  showQuestion();

  document.getElementById("status").textContent =
    "Questoes de demonstracao carregadas.";
};

// IMPORTAÇÃO JSON

document.getElementById("jsonFile").onchange =
async function(event) {

  try {

    const file = event.target.files[0];

    if (!file) {
      return;
    }

    const text = await file.text();

    const data = JSON.parse(text);

    const raw = Array.isArray(data)
      ? data
      : data.questoes;

    if (!Array.isArray(raw)) {

      throw new Error(
        "O JSON precisa conter uma lista de questoes."
      );
    }

    const validQuestions = raw
      .map(normalizeQuestion)
      .filter(Boolean);

    if (!validQuestions.length) {

      throw new Error(
        "Nenhuma questao compativel encontrada."
      );
    }

    questions = validQuestions;

    questionIndex = 0;

    answered = false;

    showQuestion();

    document.getElementById("status").textContent =
      `${questions.length} questoes carregadas.`;

  } catch (error) {

    document.getElementById("status").textContent =
      "Erro no JSON: " + error.message;
  }
};

// CONTROLES E MÃOS

const controllerFactory =
  new XRControllerModelFactory();

const handFactory =
  new XRHandModelFactory();

function selectObject(source) {

  rotationMatrix.identity();

  rotationMatrix.extractRotation(
    source.matrixWorld
  );

  raycaster.ray.origin.setFromMatrixPosition(
    source.matrixWorld
  );

  raycaster.ray.direction
    .set(0, 0, -1)
    .applyMatrix4(rotationMatrix);

  const intersections =
    raycaster.intersectObjects(
      interactiveObjects,
      false
    );

  if (!intersections.length) {
    return;
  }

  const target = intersections[0];

  if (target.distance > 10) {
    return;
  }

  const action = target.object.userData.action;

  if (typeof action === "function") {
    action();
  }
}

// CONFIGURAR OS DOIS LADOS

for (let i = 0; i < 2; i++) {

  const controller =
    renderer.xr.getController(i);

  controller.addEventListener(
    "selectstart",
    () => selectObject(controller)
  );

  scene.add(controller);

  // PONTEIRO VISUAL

  const points = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 0, -5)
  ];

  const lineGeometry =
    new THREE.BufferGeometry()
      .setFromPoints(points);

  const lineMaterial =
    new THREE.LineBasicMaterial({
      color: 0x44dfff
    });

  const pointerLine = new THREE.Line(
    lineGeometry,
    lineMaterial
  );

  controller.add(pointerLine);

  // MODELO DO CONTROLE

  const grip =
    renderer.xr.getControllerGrip(i);

  grip.add(
    controllerFactory.createControllerModel(grip)
  );

  scene.add(grip);

  // RASTREAMENTO DAS MÃOS

  const hand =
    renderer.xr.getHand(i);

  hand.add(
    handFactory.createHandModel(
      hand,
      "mesh"
    )
  );

  hand.addEventListener(
    "selectstart",
    () => selectObject(hand)
  );

  scene.add(hand);
}

// ENTRAR EM REALIDADE VIRTUAL

document.getElementById("vrButton").onclick =
async function() {

  try {

    if (!navigator.xr) {

      throw new Error(
        "WebXR indisponivel neste navegador."
      );
    }

    const supported =
      await navigator.xr.isSessionSupported(
        "immersive-vr"
      );

    if (!supported) {

      throw new Error(
        "Modo VR nao suportado."
      );
    }

    const session =
      await navigator.xr.requestSession(
        "immersive-vr",
        {
          optionalFeatures: [
            "local-floor",
            "hand-tracking"
          ]
        }
      );

    await renderer.xr.setSession(session);

    document.getElementById("status").textContent =
      "Realidade virtual iniciada.";

  } catch (error) {

    document.getElementById("status").textContent =
      "Erro VR: " + error.message;
  }
};

// AJUSTE DE TELA

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

// INICIALIZAÇÃO

updateStats();

showQuestion();

document.getElementById("status").textContent =
  "Sala 3D preparada.";

renderer.setAnimationLoop(() => {

  renderer.render(scene, camera);

});

</script>

</body>
</html>
