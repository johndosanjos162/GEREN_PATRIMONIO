<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>PMSC Immersive Academy 2026</title>
<style>
:root{
  --bg:#060913; --panel:#0d2740; --panel-alt:#123c60;
  --border:#49baff; --accent:#00d1ff; --ok:#00ff88;
  --warn:#ffaa00; --err:#ff4444; --text:#e8f4ff; --muted:#8ab0d0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text)}
canvas{display:block;outline:none}

/* MENU LATERAL */
#menu{
  position:fixed;top:12px;left:12px;z-index:100;
  width:min(400px,94vw);max-height:calc(100vh - 100px);overflow-y:auto;
  padding:16px;background:rgba(6,9,19,.96);
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 32px rgba(0,209,255,.15);
  backdrop-filter:blur(12px);
}
#menu.hidden{display:none}
h2{margin:0 0 4px;font-size:16px;color:var(--accent);letter-spacing:1px}
h3{margin:12px 0 6px;font-size:13px;color:#c5eaff;text-transform:uppercase;letter-spacing:1px}
button,select,input,textarea{
  font:inherit;width:100%;padding:10px 12px;margin:4px 0;
  background:var(--panel-alt);color:#fff;
  border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:all .15s ease;
}
button:hover,select:hover{background:#1a6aa0;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.primary{background:linear-gradient(90deg,#0066cc,#00d1ff);border-color:#00d1ff;font-weight:700}
button.ok{background:#0d6b4f;border-color:#2fbf8f}
button.warn{background:#7a4a10;border-color:#d19a3a}
button.err{background:#7a1a1a;border-color:#ff4444}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row button{margin:0}

/* STATUS BAR */
#status{
  margin-top:8px;padding:8px 10px;background:rgba(0,209,255,.1);
  border-left:3px solid var(--accent);border-radius:4px;
  font-size:12px;color:#c4e9ff;min-height:20px
}
#stats-summary{
  margin-top:8px;padding:10px;background:rgba(0,255,136,.08);
  border-radius:6px;font-size:12px;line-height:1.6
}
#stats-summary b{color:var(--ok)}
hr{border:none;border-top:1px solid rgba(73,186,255,.2);margin:12px 0}

/* BOTÃO ENTRAR VR */
#enter{
  position:fixed;right:16px;bottom:16px;z-index:100;
  width:auto;padding:14px 28px;
  background:linear-gradient(90deg,#0050a8,#00d1ff);
  border:2px solid #00d1ff;border-radius:32px;
  font-weight:900;font-size:14px;letter-spacing:1px;
  box-shadow:0 0 20px rgba(0,209,255,.6);
}
#enter.hidden{display:none}

/* HUD */
#hud{
  position:fixed;top:12px;right:12px;z-index:90;
  padding:10px 16px;background:rgba(6,9,19,.9);
  border:1px solid var(--accent);border-radius:8px;
  font-size:12px;color:var(--accent);
  display:flex;gap:16px;align-items:center;
}
#hud .k{color:#fff;font-weight:700}

/* MODAL */
.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;
  background:rgba(0,0,0,.85);display:none;
  align-items:center;justify-content:center;padding:20px;
}
.modal.open{display:flex}
.modal-content{
  background:var(--bg);border:1px solid var(--border);border-radius:12px;
  padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;
}
.modal h2{font-size:20px;margin-bottom:16px}
.modal .q-text{font-size:16px;line-height:1.5;margin-bottom:16px;color:#fff}
.modal .options{display:flex;flex-direction:column;gap:8px}
.modal .option{
  padding:12px;border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:.15s
}
.modal .option:hover{background:var(--panel-alt)}
.modal .option.correct{border-color:var(--ok);background:rgba(0,255,136,.15)}
.modal .option.wrong{border-color:var(--err);background:rgba(255,68,68,.15)}
.modal .explanation{
  margin-top:16px;padding:12px;background:var(--panel-alt);
  border-left:3px solid var(--accent);border-radius:4px;
  font-size:13px;line-height:1.5
}
.modal button.close{margin-top:16px;width:auto;padding:10px 24px}

/* TABS MENU */
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{
  flex:1;min-width:80px;padding:8px;font-size:11px;
  background:var(--panel);border-color:transparent;
}
.tabs button.active{
  background:var(--panel-alt);border-color:var(--accent);
  color:var(--accent);font-weight:700
}
.tab-content{display:none}
.tab-content.active{display:block}

/* THEME SWATCHES */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.theme-swatch{
  height:36px;border-radius:6px;border:2px solid transparent;
  cursor:pointer;transition:.2s
}
.theme-swatch.active{border-color:#fff;transform:scale(1.05)}

/* FLASHCARD STAGE */
.flashcard-stage{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;
  background:rgba(0,0,0,.95);display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:20px;
}
.flashcard-stage.open{display:flex}
.flashcard{
  width:min(600px,90vw);height:min(400px,60vh);
  background:linear-gradient(135deg,var(--panel),var(--panel-alt));
  border:2px solid var(--accent);border-radius:16px;
  padding:32px;display:flex;flex-direction:column;
  justify-content:center;cursor:pointer;
  box-shadow:0 20px 60px rgba(0,209,255,.3);
  transition:transform .4s ease;
  position:relative;
}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard .front,.flashcard .back{
  position:absolute;inset:0;padding:32px;
  display:flex;flex-direction:column;justify-content:center;
  backface-visibility:hidden;
}
.flashcard .back{transform:rotateY(180deg)}
.flashcard.disabled{opacity:.5;cursor:not-allowed}
.fc-controls{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.fc-controls button{width:auto;padding:10px 20px}
.fc-progress{margin-top:12px;color:var(--muted);font-size:13px}

/* EXAM RESULT */
.exam-result{
  background:var(--panel);border:1px solid var(--accent);
  border-radius:12px;padding:20px;margin:12px 0;
}
.exam-result .score{
  font-size:32px;font-weight:900;color:var(--ok);
  text-align:center;margin:12px 0
}
.exam-result .detail{font-size:13px;color:var(--muted);text-align:center}

/* SVG CHART */
.chart{width:100%;height:120px;margin:8px 0}
.chart .bar{fill:var(--accent);transition:.3s}
.chart .bar:hover{fill:var(--ok)}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .label{fill:var(--text);font-size:10px}

@media(max-width:600px){
  #menu{width:94vw;max-height:60vh}
  #hud{font-size:10px;gap:10px}
  .row{grid-template-columns:1fr}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}

<script type="module">
// ═══════════════════════════════════════════════════════════════════
// IMPORTS
// ═══════════════════════════════════════════════════════════════════
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════════════
// STORAGE — Versionado
// ═══════════════════════════════════════════════════════════════════
const STORAGE = {
  KEY: 'pmsc_academy_v1',
  VERSION: 1,

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return this.defaults();
      const data = JSON.parse(raw);
      if (data.version !== this.VERSION) return this.defaults();
      return Object.assign(this.defaults(), data);
    } catch { return this.defaults(); }
  },

  save(data) {
    try {
      data.version = this.VERSION;
      localStorage.setItem(this.KEY, JSON.stringify(data));
    } catch (e) { console.warn('Storage save failed:', e); }
  },

  defaults() {
    return {
      version: this.VERSION,
      theme: 'cyan',
      environment: 'academy',
      lighting: 'day',
      quality: 'medium',
      fontScale: 100,
      repo: 'johndosanjos162/PMSC',
      stats: { total: 0, correct: 0, bySubject: {} },
      wrongIds: [],
      favorites: [],
      flashcards: {},  // { questionId: { interval, due, ease, reps } }
      history: [],     // [{ date, mode, correct, total, duration }]
      panels: {},      // posições dos painéis
    };
  }
};

let DB = STORAGE.load();

// ═══════════════════════════════════════════════════════════════════
// TEMAS
// ═══════════════════════════════════════════════════════════════════
const THEMES = {
  cyan:     { bg:'#060913', panel:'#0d2740', border:'#49baff', accent:'#00d1ff' },
  green:    { bg:'#061a10', panel:'#0d301e', border:'#49ff9e', accent:'#00ff88' },
  purple:   { bg:'#100620', panel:'#251040', border:'#b449ff', accent:'#c800ff' },
  white:    { bg:'#f0f4f8', panel:'#e0e8f0', border:'#3080c0', accent:'#0066cc' },
  black:    { bg:'#000000', panel:'#1a1a1a', border:'#808080', accent:'#ffffff' },
  night:    { bg:'#0a0a1a', panel:'#1a1a3a', border:'#8080ff', accent:'#aa88ff' },
  contrast: { bg:'#000000', panel:'#000000', border:'#ffff00', accent:'#ffff00' },
  sunset:   { bg:'#1a0808', panel:'#3a1810', border:'#ff8855', accent:'#ff6600' }
};

function applyTheme(name) {
  const t = THEMES[name] || THEMES.cyan;
  const root = document.documentElement;
  root.style.setProperty('--bg', t.bg);
  root.style.setProperty('--panel', t.panel);
  root.style.setProperty('--border', t.border);
  root.style.setProperty('--accent', t.accent);
  DB.theme = name;
  STORAGE.save(DB);
}

// ═══════════════════════════════════════════════════════════════════
// QUESTION NORMALIZER
// ═══════════════════════════════════════════════════════════════════
function stripPrefix(s) {
  return String(s).replace(/^[A-Ea-e]\s*[\)\.\-\:]\s*/, '').trim();
}

function normalizeOptions(options) {
  if (!Array.isArray(options)) return [];
  const pattern = /^([A-Ea-e])\s*[\)\.\-\:]\s*/;
  const hasUniformPrefix = options.every((o, i) => {
    const m = String(o).match(pattern);
    return m && m[1].toUpperCase() === 'ABCDE'[i];
  });
  return options.map(o => hasUniformPrefix ? stripPrefix(o) : String(o).trim());
}

function extractCorrect(q, options, keys) {
  const answer = q.correta ?? q.resposta ?? q.gabarito ?? q.correct ?? q.answer;
  if (typeof answer === 'number') return answer;
  if (typeof answer === 'string') {
    const v = answer.trim();
    if (/^[A-E]$/i.test(v)) return v.toUpperCase().charCodeAt(0) - 65;
    if (keys && keys.includes(v)) return keys.indexOf(v);
    if (/^\d+$/.test(v)) return Number(v);
    const clean = stripPrefix(v);
    let idx = options.indexOf(v);
    if (idx === -1) idx = options.indexOf(clean);
    return idx;
  }
  return -1;
}

function normalizeQuestion(q, fallbackSubject) {
  if (!q || typeof q !== 'object') return null;
  const text = q.enunciado ?? q.pergunta ?? q.questao ?? q.question;
  const rawOpts = q.alternativas ?? q.opcoes ?? q.options;
  if (!text || !rawOpts) return null;
  if (typeof text !== 'string' || text.length < 3) return null;

  const keys = Array.isArray(rawOpts) ? null : Object.keys(rawOpts);
  const raw = Array.isArray(rawOpts) ? rawOpts : keys.map(k => rawOpts[k]);
  if (raw.length < 2 || raw.length > 5) return null;

  const options = normalizeOptions(raw);
  const correct = extractCorrect(q, options, keys);
  if (correct < 0 || correct >= options.length) return null;

  const subject = String(q.disciplina ?? q.materia ?? q.subject ?? fallbackSubject ?? 'Geral');
  const id = String(q.id ?? `${subject}|${text}`.slice(0, 200));

  return {
    id,
    question: text,
    options,
    correct,
    subject,
    difficulty: String(q.dificuldade ?? q.difficulty ?? 'media'),
    topic: String(q.assunto ?? q.topic ?? ''),
    explanation: String(q.explicacao ?? q.comentario ?? q.explanation ?? ''),
    reference: String(q.referencia ?? q.reference ?? '')
  };
}

function flattenJSON(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === 'object') {
    if (Array.isArray(data.questoes)) return data.questoes;
    if (Array.isArray(data.questions)) return data.questions;
    const flat = [];
    for (const [subject, list] of Object.entries(data)) {
      if (Array.isArray(list)) {
        for (const q of list) {
          flat.push({ ...q, materia: q.materia || subject });
        }
      }
    }
    return flat;
  }
  return [];
}

// ═══════════════════════════════════════════════════════════════════
// GITHUB API LOADER
// ═══════════════════════════════════════════════════════════════════
async function loadFromGitHub() {
  const repo = DB.repo;
  const CANDIDATES = [
    'questoes.json', 'json.json', 'questions.json',
    'banco.json', 'pmsc.json'
  ];

  // Tentativa 1: API de contents
  try {
    $('status').textContent = `🔍 Consultando github.com/${repo}...`;
    const resp = await fetch(`https://api.github.com/repos/${repo}/contents/`, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });

    if (resp.ok) {
      const files = await resp.json();
      if (Array.isArray(files)) {
        const jsonFiles = files.filter(f =>
          f.type === 'file' && f.name.endsWith('.json') &&
          !f.name.startsWith('.') &&
          !['package.json', 'tsconfig.json'].includes(f.name)
        );

        if (jsonFiles.length > 0) {
          let allQuestions = [];
          let loadedFiles = 0;

          for (const file of jsonFiles) {
            try {
              const content = await fetch(file.download_url).then(r => r.json());
              const flat = flattenJSON(content);
              const normalized = flat.map(q => normalizeQuestion(q)).filter(Boolean);
              if (normalized.length > 0) {
                allQuestions.push(...normalized);
                loadedFiles++;
              }
            } catch (e) { console.warn('Failed:', file.name, e); }
          }

          if (allQuestions.length > 0) {
            $('status').textContent = `✅ ${allQuestions.length} questões de ${loadedFiles} arquivo(s)`;
            return allQuestions;
          }
        }
      }
    }
  } catch (e) {
    console.warn('GitHub API failed:', e);
  }

  // Tentativa 2: raw.githubusercontent com nomes conhecidos
  $('status').textContent = '🔍 Tentando nomes conhecidos...';
  for (const name of CANDIDATES) {
    for (const branch of ['main', 'master']) {
      try {
        const url = `https://raw.githubusercontent.com/${repo}/${branch}/${name}`;
        const content = await fetch(url).then(r => {
          if (!r.ok) throw new Error('404');
          return r.json();
        });
        const flat = flattenJSON(content);
        const normalized = flat.map(q => normalizeQuestion(q)).filter(Boolean);
        if (normalized.length > 0) {
          $('status').textContent = `✅ ${normalized.length} questões de ${name}`;
          return normalized;
        }
      } catch (e) { /* try next */ }
    }
  }

  // Fallback: cache
  try {
    const cached = localStorage.getItem('pmsc_questions_cache');
    if (cached) {
      const parsed = JSON.parse(cached);
      $('status').textContent = `⚠️ Offline: ${parsed.length} questões em cache`;
      return parsed;
    }
  } catch (e) {}

  return [];
}

function sphere(r, color, x, y, z) {

function cyl(r1, r2, h, color, x, y, z) {

// ═══════════════════════════════════════════════════════════════════
// TEXT RENDERING — AUTO-FIT (sem cortes)
// ═══════════════════════════════════════════════════════════════════
function pickCanvasHeight(maxLines) {
  if (maxLines <= 1) return 256;
  if (maxLines <= 2) return 384;
  if (maxLines <= 4) return 512;
  if (maxLines <= 6) return 768;
  if (maxLines <= 8) return 1024;
  return 1280;
}

function wrapByPixels(text, maxWidth, ctx) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  for (const word of words) {
    const candidate = line ? line + ' ' + word : word;
    if (ctx.measureText(candidate).width > maxWidth && line) {
      lines.push(line); line = word;
    } else line = candidate;
  }
  if (line) lines.push(line);
  return lines;
}

function drawText(text, opts = {}) {
  const {
    width = 2048, maxLines = 4, fontSizeMax = 62, fontSizeMin = 22,
    padding = 40, bgColor = '#123c60', borderColor = '#4289bb',
    textColor = '#ffffff', borderWidth = 7
  } = opts;

  const H = pickCanvasHeight(maxLines);
  const c = document.createElement('canvas');
  c.width = width; c.height = H;
  const ctx = c.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, H);
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = borderWidth;
  ctx.strokeRect(borderWidth/2, borderWidth/2, width - borderWidth, H - borderWidth);

  const maxW = width - 2 * padding;
  const maxH = H - 2 * padding;
  let fontSize = fontSizeMax;
  let lines = [];
  let lineHeight = 0;

  while (fontSize >= fontSizeMin) {
    ctx.font = `bold ${fontSize}px Segoe UI, Arial`;
    lines = wrapByPixels(text, maxW, ctx);
    lineHeight = fontSize * 1.25;
    if (lines.length <= maxLines && lines.length * lineHeight <= maxH) break;
    fontSize -= 2;
  }

  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] = lines[maxLines - 1].slice(0, -3) + '…';
  }

  ctx.font = `bold ${fontSize}px Segoe UI, Arial`;
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const totalH = lines.length * lineHeight;
  const startY = (H - totalH) / 2 + lineHeight / 2;
  lines.forEach((line, i) => ctx.fillText(line, width/2, startY + i * lineHeight));

  return c;
}

function createPanelLabel(text, opts = {}) {
  const canvas = drawText(text, opts);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const width = opts.width3D || 2.0;
  const height = width * (canvas.height / canvas.width);

  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);
  mesh.userData.canvas = canvas;
  mesh.userData.texture = tex;
  return mesh;
}

// PANEL SYSTEM — 3 painéis (esquerda, centro, direita)
// ═══════════════════════════════════════════════════════════════════
function ensurePanel(id, x, y, z, rotationY = 0) {
  if (panelRegistry.has(id)) return panelRegistry.get(id);
  const group = new THREE.Group();
  group.userData.panelId = id;
  group.position.set(x, y, z);
  group.rotation.y = rotationY;
  scene.add(group);
  panelRegistry.set(id, group);

  // Botão grab handle
  const handle = createPanelLabel(`☰ ${id.toUpperCase()}`, {
    width3D: 1.2, maxLines: 1, fontSizeMax: 60, padding: 20,
    bgColor: '#0a3a5a', borderColor: '#00d1ff'
  });
  handle.position.set(0, 1.6, 0);
  handle.userData.isGrabHandle = true;
  handle.userData.panelId = id;
  interactive.push(handle);
  group.add(handle);

  return group;
}

function clearPanels() {
  for (const [id, group] of panelRegistry) {
    group.traverse(o => {
      if (o.userData.texture) o.userData.texture.dispose();
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    scene.remove(group);
  }
  panelRegistry.clear();
  for (let i = interactive.length - 1; i >= 0; i--) {
    if (!interactive[i].userData.isTeleport) interactive.splice(i, 1);
  }
}

function addPanelText(panelId, text, yOffset, opts = {}) {
  const group = panelRegistry.get(panelId);
  if (!group) return null;
  const label = createPanelLabel(text, opts);
  label.position.set(0, yOffset, 0.01);
  if (opts.onClick) {
    label.userData.onClick = opts.onClick;
    interactive.push(label);
  }
  group.add(label);
  return label;
}

}

// ═══════════════════════════════════════════════════════════════════
// PANEL PERSISTENCE
// ═══════════════════════════════════════════════════════════════════
function savePanelState(id, group) {
  DB.panels[id] = {
    pos: group.position.toArray(),
    rot: group.rotation.y,
    scale: group.scale.x
  };
  STORAGE.save(DB);
}

function restorePanelStates() {
  for (const [id, group] of panelRegistry) {
    const saved = DB.panels[id];
    if (saved) {
      group.position.fromArray(saved.pos);
      group.rotation.y = saved.rot;
      group.scale.setScalar(saved.scale);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════
// GRAB SYSTEM
// ═══════════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const rotation = new THREE.Matrix4();

function raycastFirst(source) {
  source.updateWorldMatrix(true, false);
  rotation.extractRotation(source.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(source.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(rotation).normalize();
  const hits = raycaster.intersectObjects(interactive, false);
  return hits.length > 0 && hits[0].distance < 15 ? hits[0] : null;
}

function startGrab(source, panelId) {
  const group = panelRegistry.get(panelId);
  if (!group) return;
  if (source.userData.grabState) return;
  const pos = new THREE.Vector3();
  source.getWorldPosition(pos);
  source.userData.grabState = {
    panelId, group,
    startSourcePos: pos.clone(),
    startGroupPos: group.position.clone()
  };
  group.scale.multiplyScalar(1.03);
}

function updateGrab(entity, inputSource) {
  const state = entity.userData.grabState;
  if (!state) return;
  const pos = new THREE.Vector3();
  entity.getWorldPosition(pos);
  const delta = pos.clone().sub(state.startSourcePos);
  state.group.position.copy(state.startGroupPos.clone().add(delta));

  if (inputSource?.gamepad?.axes) {
    const axes = inputSource.gamepad.axes;
    const x = axes[2] || 0;
    const y = axes[3] || 0;
    if (Math.abs(y) > 0.2) {
      const s = Math.max(0.5, Math.min(2, state.group.scale.x * (1 + y * 0.012)));
      state.group.scale.setScalar(s);
    }
    if (Math.abs(x) > 0.2) state.group.rotation.y += x * 0.025;
  }
}

function endGrab(source) {
  const state = source.userData.grabState;
  if (!state) return;
  state.group.scale.multiplyScalar(1 / 1.03);
  savePanelState(state.panelId, state.group);
  delete source.userData.grabState;
}

function selectObject(source) {
  const hit = raycastFirst(source);
  if (!hit) return;
  const obj = hit.object;
  if (obj.userData.isGrabHandle) startGrab(source, obj.userData.panelId);
  else if (obj.userData.onClick) obj.userData.onClick();
}

// ═══════════════════════════════════════════════════════════════════
// VR CONTROLLERS + HANDS
// ═══════════════════════════════════════════════════════════════════
const controllerFactory = new XRControllerModelFactory();
const handFactory = new XRHandModelFactory();

for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i);
  ctrl.addEventListener('selectstart', () => selectObject(ctrl));
  ctrl.addEventListener('squeezestart', () => {
    const hit = raycastFirst(ctrl);
    if (hit?.object.userData.isGrabHandle) startGrab(ctrl, hit.object.userData.panelId);
  });
  ctrl.addEventListener('squeezeend', () => endGrab(ctrl));
  rig.add(ctrl);

  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
    new THREE.LineBasicMaterial({ color: 0x4cdeff })
  );
  ctrl.add(line);

  const grip = renderer.xr.getControllerGrip(i);
  grip.add(controllerFactory.createControllerModel(grip));
  rig.add(grip);

  const hand = renderer.xr.getHand(i);
  hand.add(handFactory.createHandModel(hand, 'mesh'));
  hand.addEventListener('selectstart', () => selectObject(hand));
  hand.addEventListener('selectend', () => endGrab(hand));
  rig.add(hand);
}

// ═══════════════════════════════════════════════════════════════════
// TELETRANSPORTE
// ═══════════════════════════════════════════════════════════════════
for (const [x, z] of [[0, -2], [-3, -2], [3, -2], [0, 2]]) {
  const marker = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 0.02, 32),
    new THREE.MeshBasicMaterial({ color: 0x20c8fa, transparent: true, opacity: 0.6 })
  );
  marker.position.set(x, 0.02, z);
  marker.userData.isTeleport = true;
  marker.userData.onClick = () => {
    const head = new THREE.Vector3();
    if (renderer.xr.isPresenting) renderer.xr.getCamera().getWorldPosition(head);
    else camera.getWorldPosition(head);
    rig.position.x += x - head.x;
    rig.position.z += z - head.z;
  };
  scene.add(marker);
  interactive.push(marker);
}

// ═══════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (renderer.xr.isPresenting) {
    const session = renderer.xr.getSession();
    for (let i = 0; i < session.inputSources.length; i++) {
      updateGrab(renderer.xr.getController(i), session.inputSources[i]);
      updateGrab(renderer.xr.getHand(i), session.inputSources[i]);
    }

    // Locomotion (se nenhum grab ativo)
    const anyGrab = renderer.xr.getController(0).userData.grabState ||
                    renderer.xr.getController(1).userData.grabState;
    if (!anyGrab) {
      for (const src of session.inputSources) {
        if (!src.gamepad || src.handedness !== 'left') continue;
        const axes = src.gamepad.axes;
        const x = axes[2] || 0;
        const z = axes[3] || 0;
        if (Math.abs(x) < 0.15 && Math.abs(z) < 0.15) continue;

        const dir = new THREE.Vector3();
        renderer.xr.getCamera().getWorldDirection(dir);
        dir.y = 0; dir.normalize();
        const right = new THREE.Vector3(-dir.z, 0, dir.x);
        const move = dir.multiplyScalar(-z).addScaledVector(right, x).multiplyScalar(dt * 1.5);

        rig.position.x = THREE.MathUtils.clamp(rig.position.x + move.x, -7, 7);
        rig.position.z = THREE.MathUtils.clamp(rig.position.z + move.z, -7, 7);
      }
    }
  }

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══════════════════════════════════════════════════════════════════
// ENTER VR
// ═══════════════════════════════════════════════════════════════════
$('enter').onclick = async () => {
  try {
    if (renderer.xr.isPresenting) {
      await renderer.xr.getSession().end();
      $('enter').textContent = 'ENTRAR EM VR';
      $('menu').classList.remove('hidden');
      return;
    }
    if (!navigator.xr) throw new Error('WebXR não disponível');
    const supported = await navigator.xr.isSessionSupported('immersive-vr');
    if (!supported) throw new Error('VR não suportada neste dispositivo');

    const session = await navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['local-floor', 'hand-tracking']
    });
    await renderer.xr.setSession(session);
    $('enter').textContent = 'SAIR DO VR';
    $('menu').classList.add('hidden');
    session.addEventListener('end', () => {
      $('enter').textContent = 'ENTRAR EM VR';
      $('menu').classList.remove('hidden');
    });
  } catch (e) {
    $('status').textContent = '❌ ' + e.message;
  }
};

// ═══════════════════════════════════════════════════════════════════
// UI LOGIC
// ═══════════════════════════════════════════════════════════════════
function updateHUD() {
  $('hud-total').textContent = DB.stats.total;
  $('hud-ok').textContent = DB.stats.correct;
  $('hud-err').textContent = DB.stats.total - DB.stats.correct;
  $('hud-pct').textContent = DB.stats.total > 0
    ? Math.round(DB.stats.correct * 100 / DB.stats.total) + '%'
    : '0%';

  const bySubj = DB.stats.bySubject;
  let html = `📊 <b>${DB.stats.total}</b> respondidas · <b>${DB.stats.correct}</b> acertos · `;
  html += `${DB.stats.total > 0 ? Math.round(DB.stats.correct * 100 / DB.stats.total) : 0}% aproveitamento`;
  html += `<br>❌ Revisar: <b>${DB.wrongIds.length}</b> · ⭐ Favoritas: <b>${DB.favorites.length}</b>`;
  $('stats-summary').innerHTML = html;
}

function updateReviewSummary() {
  const totalWrong = DB.wrongIds.length;
  $('review-summary').innerHTML = `
    <div style="padding:10px;background:rgba(255,68,68,.1);border-radius:6px;margin-bottom:8px">
      ❌ <b>${totalWrong}</b> questões erradas
    </div>
    <div style="padding:10px;background:rgba(255,170,0,.1);border-radius:6px">
      📇 <b>${Object.keys(DB.flashcards).length}</b> flashcards cadastrados
    </div>
  `;
}

function populateSubjects() {
  const select = $('subject');
  const current = select.value;
  while (select.options.length > 1) select.remove(1);
  const subjects = [...new Set(QUESTIONS.map(q => q.subject))].sort();
  for (const s of subjects) {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    select.appendChild(opt);
  }
  if ([...select.options].some(o => o.value === current)) select.value = current;
}

function recordAnswer(correct) {
  DB.stats.total++;
  if (correct) DB.stats.correct++;

  const q = currentPool[currentIndex];
  if (!DB.stats.bySubject[q.subject]) DB.stats.bySubject[q.subject] = { total: 0, correct: 0 };
  DB.stats.bySubject[q.subject].total++;
  if (correct) DB.stats.bySubject[q.subject].correct++;

  if (correct) {
    const idx = DB.wrongIds.indexOf(q.id);
    if (idx >= 0) DB.wrongIds.splice(idx, 1);
  } else {
    if (!DB.wrongIds.includes(q.id)) DB.wrongIds.push(q.id);
  }

  // Atualiza flashcard (SM-2)
  updateFlashcardSRS(q.id, correct ? 2 : 0);

  STORAGE.save(DB);
  updateHUD();
}

// ═══════════════════════════════════════════════════════════════════
// FLASHCARD SM-2 SIMPLIFICADO
// ═══════════════════════════════════════════════════════════════════
function updateFlashcardSRS(id, grade) {
  const now = Date.now();
  const card = DB.flashcards[id] || { interval: 0, ease: 2.5, reps: 0, due: now };

  if (grade < 1) {
    card.reps = 0;
    card.interval = 1;
  } else {
    card.reps++;
    if (card.reps === 1) card.interval = 1;
    else if (card.reps === 2) card.interval = 3;
    else card.interval = Math.round(card.interval * card.ease);
    card.ease = Math.max(1.3, card.ease + (grade - 1) * 0.15);
  }

  card.due = now + card.interval * 24 * 3600 * 1000;
  DB.flashcards[id] = card;
}

// ═══════════════════════════════════════════════════════════════════
// FLASHCARD UI
// ═══════════════════════════════════════════════════════════════════
let currentFlashcard = null;

function openFlashcard(q) {
  if (!q) return;
  currentFlashcard = q;
  const card = DB.flashcards[q.id] || { interval: 0, reps: 0 };
  $('fc-disc').textContent = q.subject;
  $('fc-front').textContent = q.question;
  $('fc-back').textContent = 'ABCDE'[q.correct];
  $('fc-exp').textContent = q.explanation || 'Sem explicação disponível.';
  $('fc-progress').textContent = `Repetições: ${card.reps} · Intervalo: ${card.interval}d`;
  $('flashcard').classList.remove('flipped');
  $('fc-controls').style.display = 'none';
  $('flashcard-stage').classList.add('open');
}

$('fc-flip').onclick = () => {
  $('flashcard').classList.toggle('flipped');
  if ($('flashcard').classList.contains('flipped')) {
    $('fc-controls').style.display = 'flex';
  }
};

$('fc-next').onclick = () => {
  const idx = currentPool.indexOf(currentFlashcard);
  const next = currentPool[(idx + 1) % currentPool.length];
  openFlashcard(next);
};

$('fc-close').onclick = () => {
  $('flashcard-stage').classList.remove('open');
};

document.querySelectorAll('[data-grade]').forEach(btn => {
  btn.onclick = () => {
    if (!currentFlashcard) return;
    updateFlashcardSRS(currentFlashcard.id, parseInt(btn.dataset.grade));
    STORAGE.save(DB);
    $('fc-next').click();
  };
});

// ═══════════════════════════════════════════════════════════════════
// RESPOSTA E NAVEGAÇÃO
// ═══════════════════════════════════════════════════════════════════
function selectAnswer(idx) {
  if (currentAnswer !== null) return;
  const q = currentPool[currentIndex];
  currentAnswer = idx;
  const correct = idx === q.correct;
  recordAnswer(correct);
  renderQuestionPanel();

  // Modal desktop
  showModal(q, idx, correct);
}

function showModal(q, selected, correct) {
  const modal = $('modal');
  $('modal-disc').textContent = q.subject;
  $('modal-q-num').textContent = `Questão ${currentIndex + 1} de ${currentPool.length}`;
  $('modal-q-text').textContent = q.question;

  const opts = $('modal-options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    if (i === q.correct) div.classList.add('correct');
    else if (i === selected) div.classList.add('wrong');
    div.textContent = `${'ABCDE'[i]}) ${opt}`;
    opts.appendChild(div);
  });

  if (q.explanation) {
    $('modal-exp').style.display = 'block';
    $('modal-exp').textContent = '📖 ' + q.explanation;
  } else {
    $('modal-exp').style.display = 'none';
  }

  modal.classList.add('open');
}

$('modal-close').onclick = () => {
  $('modal').classList.remove('open');
  nextQuestion();
};

function nextQuestion() {
  if (currentIndex < currentPool.length - 1) {
    currentIndex++;
    currentAnswer = null;
    renderQuestionPanel();
  } else {
    // Fim da sessão
    finishSession();
  }
}

function finishSession() {
  const total = currentPool.length;
  const correct = DB.stats.correct;
  alert(`Sessão finalizada!\n\nQuestões: ${total}\nAproveitamento geral: ${DB.stats.total > 0 ? Math.round(DB.stats.correct * 100 / DB.stats.total) : 0}%`);
  $('status').textContent = '✅ Sessão finalizada';
}

// ═══════════════════════════════════════════════════════════════════
// SESSÃO / POOL
// ═══════════════════════════════════════════════════════════════════
function buildPool(mode, subject, limit = 9999) {
  let pool = QUESTIONS.slice();

  if (subject && subject !== 'Todas') {
    pool = pool.filter(q => q.subject === subject);
  }

  switch (mode) {
    case 'random':
      pool = pool.sort(() => Math.random() - 0.5);
      break;
    case 'unanswered':
      pool = pool.filter(q => !DB.wrongIds.includes(q.id) && q.id);
      break;
    case 'difficult':
      pool = pool.filter(q => DB.wrongIds.includes(q.id));
      break;
  }

  return pool.slice(0, limit);
}

$('start').onclick = () => {
  const mode = $('mode').value;
  const subject = $('subject').value;
  currentPool = buildPool(mode, subject);
  if (currentPool.length === 0) {
    $('status').textContent = '⚠️ Nenhuma questão neste filtro';
    return;
  }
  currentIndex = 0;
  currentAnswer = null;
  examActive = false;
  renderQuestionPanel();
  $('status').textContent = `✅ ${currentPool.length} questões carregadas`;
};

$('demo').onclick = () => {
  QUESTIONS = [
    { id: 'demo1', question: 'Qual é a Constituição Federal atualmente vigente no Brasil?', options: ['Constituição de 1967', 'Constituição de 1988', 'Constituição de 1946', 'Constituição de 1937'], correct: 1, subject: 'Direito Constitucional', explanation: 'A Constituição de 1988 é a atual.' },
    { id: 'demo2', question: 'Qual princípio exige que a Administração Pública atue conforme a lei?', options: ['Publicidade', 'Legalidade', 'Impessoalidade', 'Eficiência'], correct: 1, subject: 'Direito Constitucional', explanation: 'A legalidade vincula toda atuação administrativa.' },
    { id: 'demo3', question: 'Qual artigo do Código Penal trata do furto?', options: ['Art. 121', 'Art. 155', 'Art. 157', 'Art. 171'], correct: 1, subject: 'Direito Penal Comum', explanation: 'O furto está no art. 155 do CP.' },
    { id: 'demo4', question: 'Qual placa indica parada obrigatória?', options: ['Placa PARE', 'Placa de estacionamento', 'Placa de velocidade máxima', 'Placa de pedestres'], correct: 0, subject: 'Legislação de Trânsito', explanation: 'A placa R-1 indica parada obrigatória.' }
  ];
  populateSubjects();
  currentPool = QUESTIONS.slice();
  currentIndex = 0;
  currentAnswer = null;
  renderQuestionPanel();
  $('status').textContent = '✅ Demonstração carregada';
};

$('refresh').onclick = async () => {
  $('status').textContent = '🔄 Recarregando...';
  QUESTIONS = await loadFromGitHub();
  if (QUESTIONS.length > 0) {
    try { localStorage.setItem('pmsc_questions_cache', JSON.stringify(QUESTIONS)); } catch {}
    populateSubjects();
    $('status').textContent = `✅ ${QUESTIONS.length} questões carregadas`;
  }
};

// ═══════════════════════════════════════════════════════════════════
// SIMULADO
// ═══════════════════════════════════════════════════════════════════
$('exam-start').onclick = () => {
  const qty = parseInt($('exam-qty').value);
  const time = parseInt($('exam-time').value);

  currentPool = QUESTIONS.sort(() => Math.random() - 0.5).slice(0, qty);
  if (currentPool.length === 0) {
    $('status').textContent = '⚠️ Sem questões disponíveis';
    return;
  }
  currentIndex = 0;
  currentAnswer = null;
  examActive = true;
  examEndsAt = time > 0 ? Date.now() + time * 60 * 1000 : 0;

  renderQuestionPanel();
  $('exam-status').innerHTML = `⏱ ${qty} questões ${time > 0 ? '/ ' + time + 'min' : '(sem tempo)'}`;
  $('status').textContent = '✅ Simulado iniciado';
};

// Timer do simulado
setInterval(() => {
  if (!examActive || examEndsAt === 0) return;
  const remaining = examEndsAt - Date.now();
  if (remaining <= 0) {
    examActive = false;
    alert('⏱ Tempo esgotado!');
    finishSession();
    return;
  }
  const min = Math.floor(remaining / 60000);
  const sec = Math.floor((remaining % 60000) / 1000);
  $('exam-status').innerHTML = `⏱ ${min}:${sec.toString().padStart(2, '0')} restantes`;
}, 1000);

// ═══════════════════════════════════════════════════════════════════
// REVIEW
// ═══════════════════════════════════════════════════════════════════
$('review-start').onclick = () => {
  currentPool = QUESTIONS.filter(q => DB.wrongIds.includes(q.id));
  if (currentPool.length === 0) {
    $('status').textContent = '✅ Nenhuma questão errada para revisar';
    return;
  }
  currentIndex = 0;
  currentAnswer = null;
  examActive = false;
  renderQuestionPanel();
  $('status').textContent = `🔄 Revisando ${currentPool.length} questões erradas`;
};

$('reset-stats').onclick = () => {
  if (!confirm('Zerar TODAS as estatísticas?')) return;
  DB.stats = { total: 0, correct: 0, bySubject: {} };
  DB.wrongIds = [];
  DB.favorites = [];
  DB.flashcards = {};
  DB.history = [];
  STORAGE.save(DB);
  updateHUD();
  updateReviewSummary();
  $('status').textContent = '🗑 Estatísticas zeradas';
};

// ═══════════════════════════════════════════════════════════════════
// ENVIRONMENT SELECTOR
// ═══════════════════════════════════════════════════════════════════
$('environment').onchange = (e) => {
  let type = e.target.value;
  if (type === 'random') {
    const opts = ['academy', 'living', 'beach', 'library', 'future', 'nature', 'penthouse', 'space', 'minimal'];
    type = opts[Math.floor(Math.random() * opts.length)];
  }

  STORAGE.save(DB);
  buildEnvironment(type);
};

$('lighting').onchange = (e) => {
  DB.lighting = e.target.value;
  STORAGE.save(DB);
  applyLighting();
};

$('reset-panels').onclick = () => {
  DB.panels = {};

};

// ═══════════════════════════════════════════════════════════════════
// THEMES
// ═══════════════════════════════════════════════════════════════════
function renderThemeSwatches() {
  const grid = $('theme-grid');
  grid.innerHTML = '';
  for (const [name, colors] of Object.entries(THEMES)) {
    const sw = document.createElement('div');
    sw.className = 'theme-swatch';
    if (name === DB.theme) sw.classList.add('active');
    sw.style.background = `linear-gradient(135deg, ${colors.bg}, ${colors.accent})`;
    sw.title = name;
    sw.onclick = () => {
      applyTheme(name);
      renderThemeSwatches();
    };
    grid.appendChild(sw);
  }
}

$('font-scale').oninput = (e) => {
  DB.fontScale = parseInt(e.target.value);
  $('font-scale-val').textContent = DB.fontScale + '%';
  STORAGE.save(DB);
};

// ═══════════════════════════════════════════════════════════════════
// REPO CONFIG
// ═══════════════════════════════════════════════════════════════════
$('repo-apply').onclick = async () => {
  DB.repo = $('repo-input').value.trim();
  STORAGE.save(DB);
  $('status').textContent = '🔄 Recarregando do repositório...';
  QUESTIONS = await loadFromGitHub();
  populateSubjects();
};

$('repo-input').value = DB.repo;

// ═══════════════════════════════════════════════════════════════════
// EXPORT/IMPORT
// ═══════════════════════════════════════════════════════════════════
$('export-data').onclick = () => {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pmsc-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

$('import-data').onclick = () => $('import-file').click();

$('import-file').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.version !== STORAGE.VERSION) {
      if (!confirm('Versão diferente. Continuar?')) return;
    }
    DB = Object.assign(STORAGE.defaults(), data);
    STORAGE.save(DB);
    applyTheme(DB.theme);
    buildEnvironment(DB.environment);
    updateHUD();
    updateReviewSummary();
    renderThemeSwatches();
    $('status').textContent = '✅ Backup importado';
  } catch (err) {
    $('status').textContent = '❌ Erro: ' + err.message;
  }
};

// ═══════════════════════════════════════════════════════════════════
// TABS MENU
// ═══════════════════════════════════════════════════════════════════
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    $(`tab-${btn.dataset.tab}`).classList.add('active');
  };
});

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
(async function init() {
  // Aplica tema
  applyTheme(DB.theme);
  renderThemeSwatches();
  $('font-scale').value = DB.fontScale;
  $('font-scale-val').textContent = DB.fontScale + '%';

      width3D: 5, maxLines: 4, fontSizeMax: 80, padding: 60
    });
  }

  console.log('[PMSC Academy] Iniciado. Questões:', QUESTIONS.length);
})();
