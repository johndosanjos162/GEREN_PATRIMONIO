<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simulador PMSC 2026 – Quest 3S</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; }
    #ui { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; z-index: 10; }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Simulador PMSC 2026 – Quest 3S</h3>
    <p>Use os controles para agarrar e mover os blocos de questões.<br>
    Aponte e clique (gatilho) para marcar a alternativa.</p>
    <input type="file" id="jsonInput" accept=".json">
  </div>

  <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor, hand-tracking">
    <a-entity id="rig" movement-controls="fly: true">
      <a-camera position="0 1.6 0" look-controls></a-camera>
      <a-entity id="leftHand" hand-controls="hand: left; handModelStyle: lowPoly"></a-entity>
      <a-entity id="rightHand" hand-controls="hand: right; handModelStyle: lowPoly" laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-sky color="#0a1628"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#1a2a4a"></a-plane>

    <!-- Painel de questões será gerado dinamicamente -->
    <a-entity id="questionContainer" position="0 1.5 -2"></a-entity>
  </a-scene>

  <script>
    let questoes = [];
    let indice = 0;
    let respostas = {};

    document.getElementById('jsonInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(ev) {
        const banco = JSON.parse(ev.target.result);
        // Flatten
        questoes = [];
        for (const [mat, lista] of Object.entries(banco)) {
          lista.forEach(q => {
            q.materia = mat;
            questoes.push(q);
          });
        }
        // Embaralha e pega até 60
        questoes = questoes.sort(() => Math.random() - 0.5).slice(0, 60);
        renderQuestion();
      };
      reader.readAsText(file);
    });

    function renderQuestion() {
      const container = document.getElementById('questionContainer');
      container.innerHTML = '';

      if (indice >= questoes.length) {
        container.innerHTML = `<a-text value="Prova finalizada!\\nAcertos: ${Object.values(respostas).filter((r,i)=>r===questoes[i].correta).length}/${questoes.length}" 
          color="white" align="center" width="4" position="0 0 0"></a-text>`;
        return;
      }

      const q = questoes[indice];

      // Bloco da pergunta (agarrável)
      const pergunta = document.createElement('a-entity');
      pergunta.setAttribute('geometry', 'primitive: plane; width: 2.8; height: 1.2');
      pergunta.setAttribute('material', 'color: #1e3a5f; opacity: 0.95');
      pergunta.setAttribute('position', '0 0.8 0');
      pergunta.setAttribute('class', 'clickable');
      pergunta.setAttribute('grabbable', '');
      pergunta.innerHTML = `<a-text value="Q${indice+1}/${questoes.length} - ${q.materia}\\n\\n${q.pergunta.substring(0,180)}..." 
        color="white" align="center" width="2.6" wrap-count="40" position="0 0 0.01"></a-text>`;
      container.appendChild(pergunta);

      // Alternativas
      q.alternativas.forEach((alt, i) => {
        const letra = alt[0];
        const y = 0.1 - i * 0.35;
        const btn = document.createElement('a-entity');
        btn.setAttribute('geometry', 'primitive: plane; width: 2.4; height: 0.3');
        btn.setAttribute('material', `color: ${respostas[indice]===letra ? '#2ecc71' : '#34495e'}`);
        btn.setAttribute('position', `0 ${y} 0`);
        btn.setAttribute('class', 'clickable');
        btn.setAttribute('data-letra', letra);
        btn.innerHTML = `<a-text value="${alt}" color="white" align="left" width="2.2" position="-1.1 0 0.01"></a-text>`;
        
        btn.addEventListener('click', () => {
          respostas[indice] = letra;
          renderQuestion();
        });
        container.appendChild(btn);
      });

      // Botões navegação
      const prev = document.createElement('a-entity');
      prev.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.25');
      prev.setAttribute('material', 'color: #e67e22');
      prev.setAttribute('position', '-1.2 -1.6 0');
      prev.setAttribute('class', 'clickable');
      prev.innerHTML = `<a-text value="ANTERIOR" color="white" align="center" width="1.5" position="0 0 0.01"></a-text>`;
      prev.addEventListener('click', () => { if(indice>0){indice--; renderQuestion();} });
      container.appendChild(prev);

      const next = document.createElement('a-entity');
      next.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.25');
      next.setAttribute('material', 'color: #3498db');
      next.setAttribute('position', '1.2 -1.6 0');
      next.setAttribute('class', 'clickable');
      next.innerHTML = `<a-text value="PRÓXIMA" color="white" align="center" width="1.5" position="0 0 0.01"></a-text>`;
      next.addEventListener('click', () => { if(indice<questoes.length-1){indice++; renderQuestion();} });
      container.appendChild(next);
    }
  </script>
</body>
</html>
